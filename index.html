<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<!-- iOS "Add to Home Screen" icon + behavior -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BB Staff">
<meta name="theme-color" content="#3D2E8C">

<!-- General favicon + PWA manifest (Android/Chrome) -->
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<title>Beaconblitz Staff - Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --ink:#2B2650;
    --indigo:#3D2E8C;
    --indigo-2:#5B4BC4;
    --marigold:#FF8A3D;
    --marigold-dim:#FFE3CC;
    --clay-bg:#EAE7F5;
    --clay-bg-2:#E2DEF3;
    --paper:#EAE7F5;
    --muted:#7B7699;
    --line:#DCD8EE;
    --success:#2E9E6D;
    --danger:#D64545;
    --radius:26px;
    --clay-light: rgba(255,255,255,0.85);
    --clay-dark: rgba(146,138,204,0.38);
  }
  body.dark-mode{
    --ink:#F4F0FF;
    --indigo:#C9C0FF;
    --indigo-2:#A998FF;
    --marigold:#FFB06D;
    --marigold-dim:#4A3028;
    --clay-bg:#171426;
    --clay-bg-2:#211C34;
    --paper:#1D1930;
    --muted:#B4ACD2;
    --line:#342E4A;
    --success:#62D39A;
    --danger:#FF7B7B;
    --clay-light: rgba(255,255,255,0.08);
    --clay-dark: rgba(0,0,0,0.48);
  }
  body.dark-mode .topbar{
    background:linear-gradient(135deg,#241B53 0%, #33276D 50%, #5B244B 100%);
    box-shadow:0 10px 24px rgba(0,0,0,0.45);
  }
  body.dark-mode .topbar .eyebrow,
  body.dark-mode .topbar p{color:#D8D0FF;}
  body.dark-mode .btn-primary,
  body.dark-mode .role-toggle button.active,
  body.dark-mode .chip.active,
  body.dark-mode .chat-bubble.own{
    background:linear-gradient(135deg,#7668E8,#493BA8);
    color:#fff;
    box-shadow:5px 5px 12px rgba(0,0,0,0.42), -3px -3px 8px rgba(255,255,255,0.06);
  }
  body.dark-mode .btn-marigold,
  body.dark-mode .chat-send-btn{
    background:linear-gradient(135deg,#D57742,#9E335F);
    color:#fff;
    box-shadow:5px 5px 12px rgba(0,0,0,0.42), -3px -3px 8px rgba(255,255,255,0.06);
  }
  body.dark-mode .tile-icon{
    color:#E4DEFF;
    box-shadow:5px 5px 10px rgba(0,0,0,0.42), -4px -4px 9px rgba(255,255,255,0.05);
  }
  body.dark-mode input,
  body.dark-mode select,
  body.dark-mode textarea{background:#211C34;}
  body.dark-mode input::placeholder,
  body.dark-mode textarea::placeholder{color:#8278A5;}
  body.dark-mode .avatar,
  body.dark-mode .profile-photo{
    background:linear-gradient(135deg,#7668E8,#493BA8);
    box-shadow:5px 5px 12px rgba(0,0,0,0.42), -3px -3px 8px rgba(255,255,255,0.06);
  }
  body.dark-mode .chat-input-bar{box-shadow:0 -10px 18px rgba(0,0,0,0.3);}
  body.dark-mode .chat-tool-btn{color:#E4DEFF;}
  body.dark-mode .bottom-nav button.active{color:#FFB06D;}
  body.dark-mode .qr-ticket .qrbox{background:#F9F8FF;}
  body.dark-mode .badge-in{background:#183C31; color:#7FE1AE;}
  body.dark-mode .badge-out{background:#4A2028; color:#FF9A9A;}
  body.dark-mode .badge-half{background:#463122; color:#FFC17E;}
  body.dark-mode .badge-pending{background:#2C2741; color:#C9C0FF;}
  body.dark-mode .badge-holiday{background:#1F344D; color:#8CBFFF;}
  body.dark-mode .config-warning{color:#FFE2B8;}
  body.dark-mode .config-warning code{background:#2A223A; color:#F4F0FF;}
  body.dark-mode .toast{background:#F4F0FF; color:#171426;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--clay-bg);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Sora',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}

  #app{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    background:var(--clay-bg);
    position:relative;
    display:flex;
    flex-direction:column;
  }

  /* ---- Claymorphism core: soft dual shadow gives a puffy embossed look ---- */
  .clay-raised{
    box-shadow: 8px 8px 16px var(--clay-dark), -8px -8px 16px var(--clay-light);
  }
  .clay-raised-sm{
    box-shadow: 5px 5px 10px var(--clay-dark), -5px -5px 10px var(--clay-light);
  }
  .clay-pressed{
    box-shadow: inset 5px 5px 10px var(--clay-dark), inset -5px -5px 10px var(--clay-light);
  }

  .topbar{
    background:linear-gradient(135deg, #3D2E8C 0%, #6B4FC9 45%, #C2417A 85%, #FF8A3D 120%);
    color:#fff;
    padding:24px 20px 30px;
    border-radius:0 0 34px 34px;
    box-shadow: 0 10px 24px rgba(61,46,140,0.35);
  }
  .topbar .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#E4DBFF;
    font-weight:600;
    margin-bottom:6px;
  }
  .topbar h1{
    font-size:24px;
    margin:0;
    font-weight:700;
  }
  .topbar p{margin:6px 0 0; color:#E4DBFF; font-size:14px;}

  .screen{padding:22px 20px; flex:1; display:flex; flex-direction:column; gap:18px;}

  .card{
    background:var(--paper);
    border-radius:var(--radius);
    padding:22px;
    border:none;
    box-shadow: 8px 8px 16px var(--clay-dark), -8px -8px 16px var(--clay-light);
  }

  label{display:block; font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px;}
  input, select, textarea{
    width:100%;
    padding:14px 16px;
    border-radius:16px;
    border:none;
    font-size:16px;
    font-family:'Inter',sans-serif;
    background:var(--clay-bg);
    color:var(--ink);
    margin-bottom:16px;
    box-shadow: inset 4px 4px 8px var(--clay-dark), inset -4px -4px 8px var(--clay-light);
  }
  input:focus, select:focus, textarea:focus{outline:none; box-shadow: inset 4px 4px 8px var(--clay-dark), inset -4px -4px 8px var(--clay-light), 0 0 0 2px var(--indigo-2);}

  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%;
    padding:16px 18px;
    border-radius:18px;
    border:none;
    font-family:'Sora',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:scale(0.97); box-shadow: inset 4px 4px 8px rgba(0,0,0,0.15), inset -4px -4px 8px rgba(255,255,255,0.15);}
  .btn-primary{background:linear-gradient(135deg,#5B4BC4,#3D2E8C); color:#fff; box-shadow: 6px 6px 14px rgba(61,46,140,0.4), -4px -4px 10px rgba(255,255,255,0.5);}
  .btn-marigold{background:linear-gradient(135deg,#FFA35C,#C2417A); color:#fff; box-shadow: 6px 6px 14px rgba(194,65,122,0.35), -4px -4px 10px rgba(255,255,255,0.5);}
  .btn-outline{background:var(--clay-bg); color:var(--indigo); border:none; box-shadow: 5px 5px 10px var(--clay-dark), -5px -5px 10px var(--clay-light);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn-ghost{background:none; color:var(--muted); font-weight:500; padding:8px; box-shadow:none;}
  .ui-icon{
    width:1.18em; height:1.18em;
    display:inline-block; flex-shrink:0;
    vertical-align:-0.18em;
  }
  .ui-icon svg{
    width:100%; height:100%;
    display:block;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .icon-only{font-size:0;}
  .icon-only .ui-icon{font-size:18px;}

  .role-toggle{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:16px; padding:6px; border-radius:18px; background:var(--clay-bg); box-shadow: inset 4px 4px 8px var(--clay-dark), inset -4px -4px 8px var(--clay-light);}
  .role-toggle button{
    min-width:0; padding:10px 6px; border-radius:13px; border:none;
    background:transparent; font-family:'Sora',sans-serif; font-weight:600; font-size:12px; color:var(--muted); cursor:pointer;
    box-shadow:none; white-space:nowrap;
  }
  .role-toggle button.active{background:linear-gradient(135deg,#5B4BC4,#3D2E8C); color:#fff; box-shadow: 3px 3px 8px rgba(61,46,140,0.28), -2px -2px 6px rgba(255,255,255,0.35);}
  .login-choice-title{font-family:'Sora',sans-serif; font-size:18px; font-weight:700; margin:0 0 6px;}
  .login-choice-copy{font-size:13px; color:var(--muted); line-height:1.45; margin:0 0 16px;}
  .login-card{position:relative; overflow:hidden;}
  .login-card.login-error{animation:loginShake .38s ease;}
  .login-card.login-success{animation:loginPop .46s ease;}
  .login-card.login-error .login-field{box-shadow: inset 4px 4px 8px var(--clay-dark), inset -4px -4px 8px var(--clay-light), 0 0 0 2px var(--danger);}
  .login-field{
    display:flex; align-items:center; gap:10px;
    margin-bottom:16px; padding:0 14px;
    border-radius:16px; background:var(--clay-bg);
    box-shadow: inset 4px 4px 8px var(--clay-dark), inset -4px -4px 8px var(--clay-light);
  }
  .login-field .ui-icon{color:var(--indigo); width:20px; height:20px;}
  .login-field input{
    margin:0; padding:14px 0; box-shadow:none; background:transparent; border-radius:0;
  }
  .login-field input:focus{box-shadow:none;}
  .login-status{
    display:none; align-items:center; justify-content:center; gap:8px;
    margin:-4px 0 12px; padding:10px 12px; border-radius:14px;
    font-size:13px; font-weight:700;
  }
  .login-status.show{display:flex;}
  .login-status.error{background:#FDE7E7; color:var(--danger);}
  .login-status.success{background:#DDF3E7; color:var(--success);}
  body.dark-mode .login-status.error{background:#4A2028;}
  body.dark-mode .login-status.success{background:#183C31;}
  .category-bubbles{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 0 16px;}
  .category-bubbles button{
    min-width:0; padding:12px 8px; border:none; border-radius:18px;
    background:var(--clay-bg); color:var(--muted); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    font-family:'Sora',sans-serif; font-size:11px; font-weight:700;
    box-shadow: 4px 4px 8px var(--clay-dark), -4px -4px 8px var(--clay-light);
    transition:transform .14s ease, color .14s ease, box-shadow .14s ease;
  }
  .category-bubbles button:active{transform:scale(.96);}
  .category-bubbles .ui-icon{width:20px; height:20px;}
  .category-bubbles button span:last-child{white-space:nowrap;}
  .category-bubbles button:nth-child(3) span:last-child{font-size:10px;}
  .category-bubbles button.active .ui-icon{animation:iconBounce .38s ease;}
  .login-submit{position:relative; overflow:hidden;}
  .login-submit.loading::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent);
    transform:translateX(-100%); animation:loginSweep 1s linear infinite;
  }
  .category-bubbles button.active{
    background:linear-gradient(135deg,#5B4BC4,#3D2E8C);
    color:#fff;
    box-shadow: inset 2px 2px 5px rgba(0,0,0,0.25), inset -2px -2px 5px rgba(255,255,255,0.15);
  }
  @keyframes loginShake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(7px);}
    60%{transform:translateX(-5px);}
    80%{transform:translateX(3px);}
  }
  @keyframes loginPop{
    0%{transform:scale(1);}
    45%{transform:scale(1.025);}
    100%{transform:scale(1);}
  }
  @keyframes iconBounce{
    0%,100%{transform:translateY(0);}
    45%{transform:translateY(-3px);}
  }
  @keyframes loginSweep{
    to{transform:translateX(100%);}
  }

  .chip-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .chip{
    padding:9px 16px; border-radius:999px; border:none; background:var(--clay-bg);
    font-size:12px; font-weight:600; color:var(--muted); cursor:pointer; font-family:'Inter',sans-serif;
    box-shadow: 4px 4px 8px var(--clay-dark), -4px -4px 8px var(--clay-light);
  }
  .chip.active{background:linear-gradient(135deg,#5B4BC4,#3D2E8C); color:#fff; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.25), inset -2px -2px 5px rgba(255,255,255,0.15);}
  .theme-toggle{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}

  .link{color:var(--indigo-2); font-weight:600; text-decoration:none; cursor:pointer; background:none; border:none; padding:0; font-size:14px; font-family:'Inter',sans-serif;}

  .error-text{color:var(--danger); font-size:13px; margin:-8px 0 10px; font-weight:600;}

  .stat-row{display:flex; gap:14px;}
  .stat{flex:1; background:var(--clay-bg); border-radius:18px; padding:16px; text-align:center; box-shadow: 5px 5px 10px var(--clay-dark), -5px -5px 10px var(--clay-light);}
  .stat .num{font-family:'Sora',sans-serif; font-weight:800; font-size:22px; color:var(--indigo);}
  .stat .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}

  .qr-ticket{
    background:var(--paper);
    border-radius:28px;
    padding:24px;
    text-align:center;
    position:relative;
    border:none;
    box-shadow: 8px 8px 16px var(--clay-dark), -8px -8px 16px var(--clay-light);
  }
  .qr-ticket .biz{font-family:'Sora',sans-serif; font-weight:700; color:var(--indigo); font-size:16px; margin-bottom:12px;}
  .qr-ticket .qrbox{display:flex; justify-content:center; margin:6px 0 14px; padding:14px; background:#fff; border-radius:18px; box-shadow: inset 3px 3px 8px rgba(146,138,204,0.25);}
  .qr-ticket .hint{font-size:12px; color:var(--muted);}

  .staff-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; border-radius:18px; margin-bottom:10px;
    background:var(--clay-bg); box-shadow: 4px 4px 10px var(--clay-dark), -4px -4px 10px var(--clay-light);
  }
  .staff-row:last-child{margin-bottom:0;}
  .staff-name{font-weight:600; font-size:15px;}
  .staff-sub{font-size:12px; color:var(--muted);}
  .avatar{
    width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#5B4BC4,#3D2E8C);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;
    margin-right:12px; box-shadow: 3px 3px 8px rgba(61,46,140,0.35);
    overflow:hidden;
  }
  .avatar img{width:100%; height:100%; object-fit:cover; display:block;}
  .profile-photo{
    width:86px; height:86px; border-radius:28px;
    background:linear-gradient(135deg,#5B4BC4,#3D2E8C);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-family:'Sora',sans-serif; font-weight:800; font-size:28px;
    box-shadow: 6px 6px 14px rgba(61,46,140,0.35), -4px -4px 10px rgba(255,255,255,0.35);
    overflow:hidden; flex-shrink:0;
  }
  .profile-photo img{width:100%; height:100%; object-fit:cover; display:block;}
  .profile-photo-actions{display:flex; flex:1; flex-direction:column; gap:8px;}
  .row-flex{display:flex; align-items:center;}

  .date-group-label{
    font-family:'Sora',sans-serif; font-weight:700; font-size:13px; color:var(--indigo);
    margin:2px 0 2px; padding-top:6px;
  }
  .attendance-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; border-radius:18px; margin-bottom:10px;
    background:var(--clay-bg); box-shadow: 4px 4px 10px var(--clay-dark), -4px -4px 10px var(--clay-light);
  }
  .attendance-item:last-child{margin-bottom:0;}
  .att-left{display:flex; flex-direction:column; gap:2px;}
  .att-right{display:flex; flex-direction:column; align-items:flex-end; gap:4px;}
  .badge{
    font-size:11px; font-weight:700; padding:5px 12px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em;
    box-shadow: inset 1px 1px 3px rgba(0,0,0,0.08);
  }
  .badge-in{background:#DDF3E7; color:var(--success);}
  .badge-out{background:#FDE7E7; color:var(--danger);}
  .badge-half{background:var(--marigold-dim); color:#B85E1A;}
  .badge-pending{background:#EDEBFA; color:var(--muted);}
  .badge-holiday{background:#E3F0FF; color:#2E6FBF;}
  .map-link{font-size:11px; color:var(--indigo-2); text-decoration:none; font-weight:600;}

  .bottom-nav{
    display:flex;
    background:var(--paper);
    padding:12px 8px 16px;
    border-radius:28px 28px 0 0;
    box-shadow: 0 -6px 16px var(--clay-dark);
    position:sticky;
    bottom:0;
    z-index:50;
  }
  .bottom-nav button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    font-family:'Inter',sans-serif; font-size:11px; font-weight:600; color:var(--muted); cursor:pointer;
  }
  .bottom-nav button.active{color:var(--marigold);}
  .bottom-nav .icon{font-size:20px; line-height:1; color:currentColor;}

  .section-title{font-family:'Sora',sans-serif; font-weight:700; font-size:16px; margin:0 0 4px;}

  .tile-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:18px 12px;
  }
  .tile{
    display:flex; flex-direction:column; align-items:center; gap:9px;
    background:none; border:none; cursor:pointer; padding:0; font-family:'Inter',sans-serif;
    transition:transform .12s ease;
  }
  .tile:active{transform:scale(0.94);}
  .tile-icon{
    width:58px; height:58px; border-radius:20px;
    display:flex; align-items:center; justify-content:center; font-size:25px; color:var(--indigo);
    box-shadow: 5px 5px 10px var(--clay-dark), -5px -5px 10px var(--clay-light);
  }
  .tile-icon .ui-icon{width:27px; height:27px;}
  .tile-label{font-size:12px; font-weight:600; color:var(--ink); text-align:center; line-height:1.25;}

  .list-empty-note{text-align:center; color:var(--muted); font-size:13px; padding:16px 0;}

  .scan-punch{
    text-align:center;
    padding:34px 20px;
  }
  .scan-punch .stamp{
    width:88px;height:88px;border-radius:30px;
    background:var(--success);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px; color:#fff; font-size:38px;
    box-shadow: 6px 6px 14px rgba(46,158,109,0.4), -4px -4px 10px rgba(255,255,255,0.5);
  }
  .scan-punch.out .stamp{background:var(--danger); box-shadow: 6px 6px 14px rgba(214,69,69,0.4), -4px -4px 10px rgba(255,255,255,0.5);}
  .scan-punch .time{font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:600; color:var(--indigo);}
  .scan-punch .date{color:var(--muted); font-size:13px; margin-top:4px;}

  #reader{border-radius:20px; overflow:hidden; box-shadow: inset 4px 4px 10px var(--clay-dark);}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:13px 22px; border-radius:16px; font-size:13px;
    max-width:400px; text-align:center; z-index:999;
    box-shadow: 6px 6px 16px rgba(0,0,0,0.25);
  }
  .empty{
    text-align:center; padding:30px 10px; color:var(--muted); font-size:14px;
  }
  .config-warning{
    background:var(--marigold-dim); border:none; border-radius:20px; padding:18px; font-size:13px; color:#7A4B12; line-height:1.5;
    box-shadow: inset 3px 3px 8px rgba(194,124,26,0.15);
  }

class SupabaseSnapshot {
  constructor(value){ this._value = value; }
  exists(){ return this._value !== null && this._value !== undefined; }
  val(){ return this._value; }
}

class SupabaseRef {
  constructor(adapter, path){
    this.adapter = adapter;
    this.path = adapter.cleanPath(path || '');
    this.key = this.path ? this.path.split('/').pop() : '';
    this.channel = null;
    this.limit = null;
  }
  child(childPath){ return new SupabaseRef(this.adapter, this.path ? `${this.path}/${childPath}` : childPath); }
  push(){
    const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).replace(/-/g,'');
    return new SupabaseRef(this.adapter, this.path ? `${this.path}/${id}` : id);
  }
  limitToLast(n){ this.limit = n; return this; }
  async once(event){
    if (event !== 'value') throw new Error('Only value reads are supported.');
    return new SupabaseSnapshot(await this.adapter.getTree(this.path, this.limit));
  }
  on(event, callback){
    if (event !== 'value') throw new Error('Only value listeners are supported.');
    const emit = async ()=> callback(new SupabaseSnapshot(await this.adapter.getTree(this.path, this.limit)));
    emit();
    this.channel = this.adapter.listen(this.path, emit);
    return callback;
  }
  off(){
    if (this.channel) this.adapter.removeChannel(this.channel);
    this.channel = null;
  }
  set(value){ return this.adapter.set(this.path, value); }
  update(value){ return this.adapter.update(this.path, value); }
  remove(){ return this.adapter.remove(this.path); }
}

class SupabaseFirebaseAdapter {
  constructor(client){ this.client = client; }
  cleanPath(path){ return String(path || '').replace(/^\/+|\/+$/g,''); }
  ref(path){ return new SupabaseRef(this, path); }
  now(){ return Date.now(); }
  normalize(value){
    if (value && typeof value === 'object'){
      if (value.__serverTimestamp) return this.now();
      if (Array.isArray(value)) return value.map(v=>this.normalize(v));
      const out = {};
      Object.keys(value).forEach(k=>{ out[k] = this.normalize(value[k]); });
      return out;
    }
    return value;
  }
  async rowsFor(path){
    const clean = this.cleanPath(path);
    let query = this.client.from('kv_store').select('path,value');
    if (clean) query = query.or(`path.eq.${clean},path.like.${clean}/%`);
    const { data, error } = await query;
    if (error) throw error;
    return data || [];
  }
  buildTree(path, rows, limit){
    const clean = this.cleanPath(path);
    let root = null;
    const orderedRows = (rows || []).slice().sort((a,b)=>{
      if (a.path === clean && b.path !== clean) return -1;
      if (b.path === clean && a.path !== clean) return 1;
      return 0;
    });
    orderedRows.forEach(row=>{
      if (row.path === clean){
        root = this.clone(row.value);
        return;
      }
      const relative = clean ? row.path.slice(clean.length + 1) : row.path;
      if (!relative) return;
      if (root === null || typeof root !== 'object' || Array.isArray(root)) root = {};
      const parts = relative.split('/');
      let node = root;
      parts.forEach((part, idx)=>{
        if (idx === parts.length - 1){
          node[part] = this.clone(row.value);
        } else {
          if (!node[part] || typeof node[part] !== 'object' || Array.isArray(node[part])) node[part] = {};
          node = node[part];
        }
      });
    });
    if (root && limit && typeof root === 'object' && !Array.isArray(root)){
      const entries = Object.entries(root).slice(-limit);
      root = Object.fromEntries(entries);
    }
    return root;
  }
  clone(value){ return value == null ? value : JSON.parse(JSON.stringify(value)); }
  async getTree(path, limit){ return this.buildTree(path, await this.rowsFor(path), limit); }
  flattenRows(path, value){
    const clean = this.cleanPath(path);
    const normalized = this.normalize(value);
    const rows = [];
    const walk = (currentPath, currentValue)=>{
      if (currentValue && typeof currentValue === 'object' && !Array.isArray(currentValue)){
        const keys = Object.keys(currentValue);
        if (!keys.length){
          rows.push({ path: currentPath, value: {} });
          return;
        }
        keys.forEach(key=>walk(currentPath ? `${currentPath}/${key}` : key, currentValue[key]));
        return;
      }
      rows.push({ path: currentPath, value: currentValue });
    };
    walk(clean, normalized);
    return rows;
  }
  async set(path, value){
    const clean = this.cleanPath(path);
    const normalized = this.normalize(value);
    if (normalized === null || normalized === undefined) return this.remove(clean);
    if (normalized && typeof normalized === 'object' && !Array.isArray(normalized)){
      await this.remove(clean);
      const rows = this.flattenRows(clean, normalized).map(row=>({
        path: row.path,
        value: row.value,
        updated_at: new Date().toISOString()
      }));
      if (!rows.length) return;
      const { error } = await this.client.from('kv_store').upsert(rows, { onConflict: 'path' });
      if (error) throw error;
      return;
    }
    const { error } = await this.client.from('kv_store').upsert({
      path: clean,
      value: normalized,
      updated_at: new Date().toISOString()
    }, { onConflict: 'path' });
    if (error) throw error;
  }
  async update(path, value){
    const clean = this.cleanPath(path);
    if (!clean){
      await Promise.all(Object.keys(value || {}).map(k=>{
        const v = value[k];
        return v === null ? this.remove(k) : this.set(k, v);
      }));
      return;
    }
    await Promise.all(Object.keys(value || {}).map(k=>{
      const v = this.normalize(value[k]);
      const childPath = clean ? `${clean}/${k}` : k;
      return v === null ? this.remove(childPath) : this.set(childPath, v);
    }));
  }
  async remove(path){
    const clean = this.cleanPath(path);
    let query = this.client.from('kv_store').delete();
    if (clean) query = query.or(`path.eq.${clean},path.like.${clean}/%`);
    const { error } = await query;
    if (error) throw error;
  }
  listen(path, callback){
    const clean = this.cleanPath(path);
    const channel = this.client.channel(`kv-${clean || 'root'}-${Math.random().toString(16).slice(2)}`)
      .on('postgres_changes', { event:'*', schema:'public', table:'kv_store' }, payload=>{
        const changed = payload.new?.path || payload.old?.path || '';
        if (!clean || changed === clean || changed.startsWith(clean + '/') || clean.startsWith(changed + '/')) callback(payload);
      })
      .subscribe();
    return channel;
  }
  removeChannel(channel){ this.client.removeChannel(channel); }
}

  if (key.includes('salary') || key.includes('pay')) return 'wallet';

  if (key.includes('reward')) return 'trophy';
  if (key.includes('chat')) return 'message';

function addDaysTs(days){
  const d = new Date();
  d.setDate(d.getDate() + Number(days || 0));
  d.setHours(23, 59, 59, 999);
  return d.getTime();
}

function parseDateInputToEndTs(value){
  if (!value) return null;
  const d = new Date(value + 'T23:59:59');
  return isNaN(d.getTime()) ? null : d.getTime();
}

function formatDateInput(ts){
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function formatAccountDate(ts){

function businessAccountInfo(biz){
  const status = biz.accountStatus || 'trial';
  const plan = biz.plan || DEFAULT_PLAN;
  const expiry = status === 'active' ? biz.subscriptionEndsAt : biz.trialEndsAt;
  const expired = (status === 'trial' || status === 'active') && expiry && Date.now() > expiry;
  const effectiveStatus = expired ? 'expired' : status;
  const staffLimit = Number(biz.staffLimit || (PLAN_CATALOG[plan] && PLAN_CATALOG[plan].staffLimit) || PLAN_CATALOG[DEFAULT_PLAN].staffLimit);
  return { status, effectiveStatus, plan, expiry, staffLimit };

    expired: 'Expired'
  }[info.effectiveStatus] || 'Trial';
}

function accountBadgeClass(biz){

  return status === 'active' ? 'badge-in' : status === 'trial' ? 'badge-half' : 'badge-out';

function assertBusinessCanUseApp(biz){
  const info = businessAccountInfo(biz || {});
  if (info.effectiveStatus === 'suspended') throw new Error('This business account is suspended. Contact main admin.');

function accountWarningHTML(){
  if (!state.session || !state.session.businessId) return '';
  if (state.session.role !== 'admin') return '';
  const status = state.session.accountStatus || '';
  if (!status || status === 'active') return '';
  const label = status === 'trial' ? 'Trial account' : status;
  return `<div class="config-warning">
    <strong>${escapeHTML(label)}</strong>: Please renew or activate this business from Main Admin before expiry to avoid login interruption.
  </div>`;
}

function csvCell(value){
  const text = String(value == null ? '' : value);
  return `"${text.replace(/"/g, '""')}"`;
}

function downloadTextFile(filename, text, type){
  const blob = new Blob([text], { type: type || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 500);
}

async function removeExactKvPath(path){
  if (!supabaseClient) return;

function loadTheme(){

   REALTIME DATABASE HELPERS
   /mobileIndex/{mobile} = { role, businessId, staffId? }
   /businesses/{businessId} = { name, sector, mobile, pin, adminName }
   /businesses/{businessId}/staff/{staffId} = { name, mobile, pin, gender, designation }

   --------------------------------------------------------- */

async function registerBusiness(data){
  const mobileSnap = await db.ref('mobileIndex/' + data.mobile).once('value');
  if (mobileSnap.exists()) throw new Error('This mobile number is already registered. Try logging in instead.');

  const bizRef = db.ref('businesses').push();
  await bizRef.set({
    name: data.businessName,
    sector: data.sector || '',
    mobile: data.mobile,
    pin: data.pin,
    adminName: data.adminName,
    plan: DEFAULT_PLAN,
    accountStatus: 'trial',
    staffLimit: PLAN_CATALOG[DEFAULT_PLAN].staffLimit,
    trialEndsAt: addDaysTs(DEFAULT_TRIAL_DAYS),
    subscriptionEndsAt: null,
    sellerNotes: '',
    createdAt: firebase.database.ServerValue.TIMESTAMP
  });
  await removeExactKvPath('mobileIndex/' + data.mobile);
  await db.ref('mobileIndex/' + data.mobile + '/role').set('admin');
  await db.ref('mobileIndex/' + data.mobile + '/businessId').set(bizRef.key);
  return bizRef.key;
}

async function loginUser(mobile, pin){
  const mainAdminSnap = await db.ref('mainAdmins/' + mobile).once('value');
  if (mainAdminSnap.exists()){
    const mainAdmin = mainAdminSnap.val() || {};
    if (normalizePin(mainAdmin.pin) !== pin) throw new Error('Incorrect PIN.');
    return { role:'mainAdmin', mobile, name: mainAdmin.name || 'Main Admin' };
  }

  const idxSnap = await db.ref('mobileIndex/' + mobile).once('value');
  if (!idxSnap.exists()) throw new Error("We couldn't find an account with that mobile number.");
  const idx = idxSnap.val();

  if (idx.role === 'main' || idx.role === 'mainAdmin'){
    const adminSnap = await db.ref('mainAdmins/' + mobile).once('value');
    const admin = adminSnap.val();
    if (!admin) throw new Error('Main admin login record is missing. Run the login reset SQL again.');
    if (normalizePin(admin.pin) !== pin) throw new Error('Incorrect PIN.');
    return { role:'mainAdmin', mobile, name: admin.name || 'Main Admin' };
  }

  if (idx.role === 'admin'){
    const bizSnap = await db.ref('businesses/' + idx.businessId).once('value');
    const biz = bizSnap.val();
    if (!biz) throw new Error('Business login record is missing. Ask main admin to reset this login.');
    assertBusinessCanUseApp(biz);
    if (normalizePin(biz.pin) !== pin) throw new Error('Incorrect PIN.');
    return {
      role:'admin',
      businessId: idx.businessId,
      name: biz.adminName,
      businessName: biz.name,
      mobile: biz.mobile || mobile,
      plan: biz.plan || DEFAULT_PLAN,
      accountStatus: businessAccountInfo(biz).effectiveStatus,
      staffLimit: businessAccountInfo(biz).staffLimit
    };
  } else {
    const staffSnap = await db.ref('businesses/' + idx.businessId + '/staff/' + idx.staffId).once('value');
    const staff = staffSnap.val();
    if (!staff) throw new Error('Staff login record is missing. Ask admin to reset this login.');
    if (normalizePin(staff.pin) !== pin) throw new Error('Incorrect PIN.');
    const bizSnap = await db.ref('businesses/' + idx.businessId).once('value');
    const biz = bizSnap.val();
    if (!biz) throw new Error('Business login record is missing. Ask admin to reset this login.');
    assertBusinessCanUseApp(biz);
    return {
      role:'staff',
      businessId: idx.businessId,
      staffId: idx.staffId,
      name: staff.name,
      businessName: biz.name,
      adminMobile: biz.mobile,
      plan: biz.plan || DEFAULT_PLAN,
      accountStatus: businessAccountInfo(biz).effectiveStatus
    };
  }
}

async function addStaff(businessId, data){
  const mobileSnap = await db.ref('mobileIndex/' + data.mobile).once('value');
  if (mobileSnap.exists()) throw new Error('This mobile number is already registered elsewhere.');
  const bizSnap = await db.ref('businesses/' + businessId).once('value');
  const biz = bizSnap.val() || {};
  assertBusinessCanUseApp(biz);
  const staff = biz.staff || {};
  const info = businessAccountInfo(biz);
  if (Object.keys(staff).length >= info.staffLimit){
    throw new Error(`Staff limit reached for ${PLAN_CATALOG[info.plan]?.label || 'this'} plan. Ask main admin to upgrade this business.`);
  }

  const staffRef = db.ref('businesses/' + businessId + '/staff').push();
  await staffRef.set({
    name: data.name,
    mobile: data.mobile,
    pin: data.pin,
    gender: data.gender || '',
    designation: data.designation || '',
    employmentType: data.employmentType || 'full_time',
    expectedCheckIn: data.expectedCheckIn || '09:30',
    expectedCheckOut: data.expectedCheckOut || '18:00',
    graceMinutes: data.graceMinutes != null && data.graceMinutes !== '' ? Number(data.graceMinutes) : 30,
    monthlySalary: data.monthlySalary != null && data.monthlySalary !== '' ? Number(data.monthlySalary) : 0,
    employmentType: data.employmentType || 'full',
    createdAt: firebase.database.ServerValue.TIMESTAMP
  });
  await removeExactKvPath('mobileIndex/' + data.mobile);
  await db.ref('mobileIndex/' + data.mobile + '/role').set('staff');
  await db.ref('mobileIndex/' + data.mobile + '/businessId').set(businessId);
  await db.ref('mobileIndex/' + data.mobile + '/staffId').set(staffRef.key);
  return staffRef.key;
}

async function updateStaff(businessId, staffId, data){
  const staffSnap = await db.ref('businesses/' + businessId + '/staff/' + staffId).once('value');
  const existing = staffSnap.val() || {};
  const cleanMobile = String(data.mobile || existing.mobile || '').trim();
  const cleanPin = String(data.pin || existing.pin || '').trim();
  if (!/^\d{10}$/.test(cleanMobile)) throw new Error('Enter a valid 10 digit staff mobile number.');
  if (!PIN_PATTERN.test(cleanPin)) throw new Error('Staff PIN must be exactly 4 numbers.');
  if (cleanMobile !== existing.mobile){
    const mobileSnap = await db.ref('mobileIndex/' + cleanMobile).once('value');
    if (mobileSnap.exists()) throw new Error('This mobile number is already used by another account.');
  }

  const updates = {};
  updates['businesses/' + businessId + '/staff/' + staffId + '/name'] = data.name;
  updates['businesses/' + businessId + '/staff/' + staffId + '/mobile'] = cleanMobile;
  updates['businesses/' + businessId + '/staff/' + staffId + '/pin'] = cleanPin;
  updates['businesses/' + businessId + '/staff/' + staffId + '/designation'] = data.designation || '';
  updates['businesses/' + businessId + '/staff/' + staffId + '/expectedCheckIn'] = data.expectedCheckIn || '09:30';
  updates['businesses/' + businessId + '/staff/' + staffId + '/expectedCheckOut'] = data.expectedCheckOut || '18:00';
  updates['businesses/' + businessId + '/staff/' + staffId + '/graceMinutes'] = data.graceMinutes != null && data.graceMinutes !== '' ? Number(data.graceMinutes) : 30;
  updates['businesses/' + businessId + '/staff/' + staffId + '/monthlySalary'] = data.monthlySalary != null && data.monthlySalary !== '' ? Number(data.monthlySalary) : 0;
  updates['businesses/' + businessId + '/staff/' + staffId + '/employmentType'] = data.employmentType || 'full';
  if (existing.mobile && existing.mobile !== cleanMobile) updates['mobileIndex/' + existing.mobile] = null;
  await removeExactKvPath('mobileIndex/' + cleanMobile);
  updates['mobileIndex/' + cleanMobile + '/role'] = 'staff';
  updates['mobileIndex/' + cleanMobile + '/businessId'] = businessId;
  updates['mobileIndex/' + cleanMobile + '/staffId'] = staffId;
  await db.ref().update(updates);
}

async function deleteStaffAndData(businessId, staffId){
  const staffSnap = await db.ref('businesses/' + businessId + '/staff/' + staffId).once('value');
  const staff = staffSnap.val();
  const updates = {};
  updates['businesses/' + businessId + '/staff/' + staffId] = null;
  if (staff && staff.mobile) updates['mobileIndex/' + staff.mobile] = null;

  const [attSnap, leavesSnap, complaintsSnap] = await Promise.all([
    db.ref('businesses/' + businessId + '/attendance').once('value'),
    db.ref('businesses/' + businessId + '/leaves').once('value'),
    db.ref('businesses/' + businessId + '/complaints').once('value')
  ]);
  const attVal = attSnap.val() || {};
  Object.keys(attVal).forEach(id=>{ if (attVal[id].staffId===staffId) updates['businesses/' + businessId + '/attendance/' + id] = null; });
  const leavesVal = leavesSnap.val() || {};
  Object.keys(leavesVal).forEach(id=>{ if (leavesVal[id].staffId===staffId) updates['businesses/' + businessId + '/leaves/' + id] = null; });
  const complaintsVal = complaintsSnap.val() || {};
  Object.keys(complaintsVal).forEach(id=>{ if (complaintsVal[id].staffId===staffId) updates['businesses/' + businessId + '/complaints/' + id] = null; });

  await db.ref().update(updates);
}

  const existingSnap = await db.ref('mainAdmins/' + currentMobile).once('value');

  if (cleanMobile !== currentMobile){

async function getTodayPunchStatus(businessId, staffId){
  const attSnap = await db.ref('businesses/' + businessId + '/attendance').once('value');
  const val = attSnap.val() || {};
  const todayStr = new Date().toDateString();
  const todaysMine = Object.values(val).filter(a=>
    a.staffId===staffId && a.ts && new Date(a.ts).toDateString()===todayStr
  );
  const hasIn = todaysMine.some(a=>a.type==='in');
  const hasOut = todaysMine.some(a=>a.type==='out');
  const lastInTime = todaysMine.filter(a=>a.type==='in').sort((a,b)=>b.ts-a.ts)[0];
  const lastOutTime = todaysMine.filter(a=>a.type==='out').sort((a,b)=>b.ts-a.ts)[0];
  return { hasIn, hasOut, lastInTime, lastOutTime };
}

/* ---------------------------------------------------------
   BROWSER NOTIFICATIONS
   Works even when the phone is locked / app is closed — unlike the
   plain Notification API above, which only fires while a tab is open.
   Uses browser notifications while the app is open.
   Background web push can be added later with a push provider.
   ---------------------------------------------------------- */
function getPushSupportIssue(){
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  if (location.protocol === 'file:') return 'Open the hosted https app, not the downloaded file.';
  if (!('Notification' in window)) return 'Notifications are not available in this browser.';
  if (!('serviceWorker' in navigator)) return 'Service worker is not supported in this browser.';
  if (isIOS && !isStandalone) return 'On iPhone, add BB Staff to Home Screen and open that app icon.';
  if (!('PushManager' in window)){
    return isIOS
      ? 'This iPhone/iOS version does not support web push. Update to iOS 16.4 or newer.'
      : 'This browser does not support web push. Use Chrome/Edge or the installed app.';
  }
  return '';
}

async function setupPushNotifications(){
  if (!('Notification' in window)){
    toast('Notifications are not available in this browser.');
    return false;
  }
  try{
    const permission = await Notification.requestPermission();
    if (permission !== 'granted'){
      toast('Notification permission was not allowed.');
      return false;
    }
    toast('Notifications enabled on this device.');
    return true;
  }catch(e){
    console.error('Notification setup failed:', e);
    toast('Notification setup failed. Try again after refresh.');
    return false;
  }
}
/* ---------------------------------------------------------
   BOOTSTRAP — restore session + handle QR deep-link (?attend=businessId)
   --------------------------------------------------------- */
async function bootstrap(){
  if (!supabaseReady){ go('setup'); return; }

  const urlParams = new URLSearchParams(window.location.search);
  const attendBiz = urlParams.get('attend');
  let existing = loadSession();

  if (existing){
    try{
      existing = await validateSavedSession(existing);
      state.session = existing;
      saveSession(existing);
      if (existing.role === 'mainAdmin'){
        listenAllBusinesses();
        listenMainAdmins();
      } else if (existing.role === 'admin'){
        listenStaff(existing.businessId);
        listenAttendance(existing.businessId, null);
        listenMeetings(existing.businessId);
        listenLeaves(existing.businessId, null);
        listenComplaints(existing.businessId, null);
        listenApps(existing.businessId);
        listenLiveLocations(existing.businessId);
        listenAllChatsLastMessage(existing.businessId);
        listenNotice(existing.businessId);
        requestNotificationPermission();
        setupPushNotifications();
      } else {
        listenAttendance(existing.businessId, existing.staffId);
        listenMeetings(existing.businessId);
        listenLeaves(existing.businessId, existing.staffId);
        listenApps(existing.businessId);
        startLiveLocationIfEnabled();
        listenLocationRequests(existing.businessId, existing.staffId);
        requestNotificationPermission();
        setupPushNotifications();
      }
    }catch(e){
      clearSession();
      state.session = null;
      existing = null;
      toast(e.message || 'Please log in again.');
    }
  }

  if (attendBiz){
    // Clean the URL so a refresh doesn't re-trigger the punch
    const cleanUrl = window.location.origin + window.location.pathname;
    window.history.replaceState({}, document.title, cleanUrl);

    if (existing && existing.role === 'staff' && existing.businessId === attendBiz){
      go('punching');
      prepareConfirm(existing.businessId, existing.staffId, existing.name, existing.adminMobile);
      return;
    } else if (existing && existing.role === 'admin'){
      toast("Log in as staff on this device to mark attendance.");
    } else if (existing && existing.businessId !== attendBiz){
      toast("This QR is for a different business than your account.");
    } else if (!existing){
      state.pendingAttendBiz = attendBiz;
      state.role = 'staff';
      go('login');
      return;
    }
  }

  if (existing){
    go(existing.role === 'mainAdmin' ? 'mainAdminHome' : (existing.role === 'admin' ? 'adminHome' : 'staffHome'));
    if (existing.role === 'staff') promptLiveLocationConsentOnce();
  } else {
    go('landing');
  }
}

async function prepareConfirm(businessId, staffId, staffName, adminMobile){
  try{
    const status = await getTodayPunchStatus(businessId, staffId);
    if (status.hasIn && status.hasOut){
      state.error = `You've already completed today's attendance — Checked In at ${fmtTime(status.lastInTime.ts)} and Checked Out at ${fmtTime(status.lastOutTime.ts)}.`;
      go('staffHome');
      return;
    }
    const suggested = status.hasIn ? 'out' : 'in';
    if (state.lastLiveLocation && Date.now() - state.lastLiveLocation.ts < 10 * 60 * 1000){
      state.pendingPunch = {
        businessId, staffId, staffName, adminMobile,
        type: suggested, lat: state.lastLiveLocation.lat, lng: state.lastLiveLocation.lng,
        lockedType: status.hasIn ? 'out' : (status.hasOut ? 'in' : null)
      };
      go('confirmPunch');
      return;
    }
    navigator.geolocation.getCurrentPosition((pos)=>{
      const { latitude, longitude } = pos.coords;
      state.lastLiveLocation = { lat: latitude, lng: longitude, ts: Date.now() };
      saveLiveLocationPermission();
      state.pendingPunch = {
        businessId, staffId, staffName, adminMobile,
        type: suggested, lat: latitude, lng: longitude,
        lockedType: status.hasIn ? 'out' : (status.hasOut ? 'in' : null)
      };
      go('confirmPunch');
    }, (err)=>{
      state.error = 'Location permission is required to mark attendance.';
      go('staffHome');
    }, { enableHighAccuracy:true, timeout:12000 });
  }catch(e){
    state.error = 'Could not read attendance status. Try again.';
    go('staffHome');
  }
}

function setPendingType(type){
  if (state.pendingPunch.lockedType && state.pendingPunch.lockedType !== type){
    toast(type==='in' ? "You've already checked in today." : "You've already checked out today.");
    return;
  }
  state.pendingPunch.type = type;
  render();
}

async function confirmPunch(){
  const p = state.pendingPunch;
  if (!p) { go('staffHome'); return; }
  await markAttendance(p.businessId, p.staffId, p.staffName, p.type, p.lat, p.lng);
  if (p.type === 'out') clearShiftTimers();
  state.lastPunchType = p.type;
  state.lastPunchAdminMobile = p.adminMobile;
  state.pendingPunch = null;
  go('punchResult');
}

    const rememberMe = document.getElementById('regRememberMe').checked;
    if (rememberMe) saveSession(session); else clearSession();
    listenStaff(businessId);
    listenAttendance(businessId, null);
    listenMeetings(businessId);
    listenLeaves(businessId, null);
    listenComplaints(businessId, null);
    listenApps(businessId);
    listenLiveLocations(businessId);
    listenAllChatsLastMessage(businessId);
    listenNotice(businessId);
    requestNotificationPermission();
      setupPushNotifications();
    toast('Business created');
    go('adminHome');
  }catch(e){
    state.error = e.message;
    render();
  }
}

async function doSaveMainBusinessAccount(){
  const b = state.allBusinesses.find(x=>x.id===state.selectedBusinessId);
  if (!b) return;
  const plan = document.getElementById('mainPlan').value;
  const accountStatus = document.getElementById('mainStatus').value;
  const staffLimit = document.getElementById('mainStaffLimit').value;
  const currentStaffCount = Object.keys(b.staff || {}).length;
  if (!staffLimit || Number(staffLimit) < 1){
    state.error = 'Staff limit must be at least 1.'; render(); return;
  }
  if (Number(staffLimit) < currentStaffCount){
    state.error = `This business already has ${currentStaffCount} staff. Limit cannot be lower than current usage.`; render(); return;
  }
  const btn = document.getElementById('mainAccountBtn');
  btn.disabled = true; btn.textContent = 'Saving...';
  try{
    await updateBusinessAccount(b.id, {
      plan,
      accountStatus,
      staffLimit,
      trialEndsAt: parseDateInputToEndTs(document.getElementById('mainTrialEnds').value),
      subscriptionEndsAt: parseDateInputToEndTs(document.getElementById('mainSubEnds').value),
      sellerNotes: document.getElementById('mainSellerNotes').value.trim()
    });
    toast('Business account updated');
    state.error = '';
  }catch(e){
    state.error = e.message || 'Could not update business account.';
  }
  render();
}

function resizeImageFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const size = 320;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const minSide = Math.min(img.width, img.height);
        const sx = (img.width - minSide) / 2;
        const sy = (img.height - minSide) / 2;
        ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function toDateKey(dateObj){
  const y = dateObj.getFullYear();
  const m = String(dateObj.getMonth()+1).padStart(2,'0');
  const d = String(dateObj.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function parseTimeToMinutes(timeStr){
  if (!timeStr) return null;
  const parts = timeStr.split(':').map(Number);
  if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) return null;
  return parts[0]*60 + parts[1];
}

function getDayStatus(staff, dateObj, staffAttendance){
  const dayStr = dateObj.toDateString();
  const todayStr = new Date().toDateString();
  if (dateObj > new Date() && dayStr !== todayStr) return { status:'future' };
  if (dateObj.getDay() === 0) return { status:'holiday' }; // Sunday = paid holiday

  const dayRecords = staffAttendance.filter(a=> a.ts && new Date(a.ts).toDateString()===dayStr);
  const inRec = dayRecords.filter(a=>a.type==='in').sort((a,b)=>a.ts-b.ts)[0];
  const outRec = dayRecords.filter(a=>a.type==='out').sort((a,b)=>a.ts-b.ts)[0];
  const expectedInMin = parseTimeToMinutes(staff.expectedCheckIn);
  const grace = (staff.graceMinutes!=null && staff.graceMinutes!=='') ? Number(staff.graceMinutes) : 30;

  if (!inRec){
    if (dayStr === todayStr){
      const now = new Date();
      const nowMin = now.getHours()*60 + now.getMinutes();
      if (expectedInMin==null || nowMin <= expectedInMin+grace) return { status:'pending' };
    }
    return { status:'absent', inTime:null, outTime:null };
  }
  if (expectedInMin==null) return { status:'present', inTime:inRec.ts, outTime: outRec?outRec.ts:null };
  const inDate = new Date(inRec.ts);
  const inMin = inDate.getHours()*60 + inDate.getMinutes();
  const status = inMin > expectedInMin+grace ? 'half' : 'present';
  return { status, inTime:inRec.ts, outTime: outRec?outRec.ts:null };
}

function dailyRate(staff){ return (Number(staff.monthlySalary)||0) / 26; }
function payForStatus(staff, status, leavePaid){
  if (status==='present') return dailyRate(staff);
  if (status==='half') return dailyRate(staff)/2;
  if (status==='leave') return leavePaid ? dailyRate(staff) : 0;
  return 0; // holiday, absent, pending, future = unpaid
}
function statusLabel(status, leavePaid){
  if (status==='leave') return leavePaid ? 'Paid Leave' : 'Unpaid Leave';
  return { present:'Present', half:'Half Day', absent:'Absent', pending:'Pending', future:'—', holiday:'Sunday (Unpaid)' }[status] || status;
}
function statusBadgeClass(status, leavePaid){
  if (status==='leave') return leavePaid ? 'badge-in' : 'badge-out';
  return { present:'badge-in', half:'badge-half', absent:'badge-out', pending:'badge-pending', future:'badge-pending', holiday:'badge-holiday' }[status] || '';
}
function isApprovedLeaveDay(staffId, dateObj){
  return state.leaves.some(l=>
    l.staffId===staffId && l.status==='approved' &&
    new Date(l.fromDate + 'T00:00:00') <= dateObj && dateObj <= new Date((l.toDate||l.fromDate) + 'T23:59:59')
  );
}
function fmtTime(ts){
  if (!ts) return '—';
  return new Date(ts).toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
}
function fmtDateLabel(ts){
  const d = new Date(ts);
  const today = new Date();
  const yesterday = new Date(); yesterday.setDate(today.getDate()-1);
  if (d.toDateString()===today.toDateString()) return 'Today';
  if (d.toDateString()===yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric', weekday:'short' });
}

function ensureSalaryState(){

function shiftSalaryMonth(delta){
  ensureSalaryState();
  let m = state.salary.month + delta;
  let y = state.salary.year;
  if (m < 0){ m = 11; y -= 1; }
  if (m > 11){ m = 0; y += 1; }
  state.salary.month = m; state.salary.year = y;
  render();
}

function setSalaryStaff(id){ ensureSalaryState(); state.salary.staffId = id; render(); }

function buildMonthRows(staff, year, month, staffAttendance){
  const daysCount = new Date(year, month+1, 0).getDate();
  const today = new Date();
  const rows = [];
  for (let d=1; d<=daysCount; d++){
    const dateObj = new Date(year, month, d);
    if (dateObj > today && dateObj.toDateString() !== today.toDateString()) break;
    let { status, inTime, outTime } = getDayStatus(staff, dateObj, staffAttendance);
    if (status !== 'holiday' && status !== 'future' && isApprovedLeaveDay(staff.id, dateObj)){
      status = 'leave'; inTime = null; outTime = null;
    }
    rows.push({ dateObj, status, inTime, outTime, leavePaid:false, pay:0 });
  }
  let leaveCount = 0;
  rows.forEach(r=>{
    if (r.status==='leave'){
      leaveCount++;
      r.leavePaid = leaveCount <= 3;
    }
    r.pay = payForStatus(staff, r.status, r.leavePaid);
  });
  return rows;
}

function rangeStart(range){
  const now = new Date();
  if (range==='today'){ const d=new Date(now); d.setHours(0,0,0,0); return d.getTime(); }
  if (range==='week'){ const d=new Date(now); d.setDate(d.getDate()-6); d.setHours(0,0,0,0); return d.getTime(); }
  if (range==='month'){ const d=new Date(now); d.setDate(d.getDate()-29); d.setHours(0,0,0,0); return d.getTime(); }
  return 0; // 'all'
}

const LIVE_LOCATION_INTERVAL_MS = 5 * 60 * 1000;
let autoCheckoutTimeout = null;
let shiftCountdownInterval = null;
let liveLocationInterval = null;
let liveLocationWatchId = null;

function clearShiftTimers(){
  if (autoCheckoutTimeout) clearTimeout(autoCheckoutTimeout);
  if (shiftCountdownInterval) clearInterval(shiftCountdownInterval);
  autoCheckoutTimeout = null; shiftCountdownInterval = null;
}

function pushLiveLocation(){
  if (!state.session || state.session.role !== 'staff') return;
  navigator.geolocation.getCurrentPosition((pos)=>{
    const { latitude, longitude } = pos.coords;
    state.lastLiveLocation = { lat: latitude, lng: longitude, ts: Date.now() };
    saveLiveLocationPermission();
    updateLiveLocation(state.session.businessId, state.session.staffId, state.session.name, latitude, longitude).catch(()=>{});
  }, ()=>{}, { enableHighAccuracy:true, timeout:10000, maximumAge:60000 });
}

function liveLocationPermissionKey(){
  return state.session && state.session.role === 'staff'
    ? `bbLiveLocation:${state.session.businessId}:${state.session.staffId}`
    : '';
}

function hasLiveLocationPermissionSaved(){
  const key = liveLocationPermissionKey();
  if (!key) return false;
  try{ return localStorage.getItem(key) === 'enabled'; }catch(e){ return false; }
}

function liveLocationConsentStatus(){
  const key = liveLocationPermissionKey();
  if (!key) return '';
  try{ return localStorage.getItem(key) || ''; }catch(e){ return ''; }
}

function hasLiveLocationConsentBeenAsked(){
  const status = liveLocationConsentStatus();
  return status === 'enabled' || status === 'asked';
}

function markLiveLocationConsentAsked(){
  const key = liveLocationPermissionKey();
  if (!key || hasLiveLocationPermissionSaved()) return;
  try{ localStorage.setItem(key, 'asked'); }catch(e){}
}

function saveLiveLocationPermission(){
  const key = liveLocationPermissionKey();
  if (!key) return;
  try{ localStorage.setItem(key, 'enabled'); }catch(e){}
}

function startLiveLocationIfEnabled(){
  if (hasLiveLocationPermissionSaved()) startLiveLocationTracking();
}

function promptLiveLocationConsentOnce(){
  if (!state.session || state.session.role !== 'staff') return;
  if (hasLiveLocationPermissionSaved()){
    startLiveLocationTracking();
    return;
  }
  if (hasLiveLocationConsentBeenAsked()) return;
  setTimeout(()=>{
    if (!state.session || state.session.role !== 'staff' || hasLiveLocationConsentBeenAsked()) return;
    const ok = window.confirm('Your admin can see your live location while this app is open, and your last saved location later. Allow one-time location setup?');
    markLiveLocationConsentAsked();
    if (ok){
      startLiveLocationTracking();
      pushLiveLocation();
      toast('Location setup started. Allow location if your browser asks.');
    } else {
      toast('Location setup skipped. You can enable it later from Profile.');
      if (state.screen === 'profile') render();
    }
  }, 450);
}

function startLiveLocationTracking(){
  if (!state.session || state.session.role !== 'staff' || !navigator.geolocation) return;
  if (liveLocationWatchId == null){
    liveLocationWatchId = navigator.geolocation.watchPosition((pos)=>{
      const { latitude, longitude } = pos.coords;
      state.lastLiveLocation = { lat: latitude, lng: longitude, ts: Date.now() };
      saveLiveLocationPermission();
      updateLiveLocation(state.session.businessId, state.session.staffId, state.session.name, latitude, longitude).catch(()=>{});
      if (state.screen === 'staffHome' || state.screen === 'profile') render();
    }, ()=>{
      if (!hasLiveLocationPermissionSaved() && state.screen === 'staffHome'){
        toast('Allow location once to enable live tracking.');
      }
    }, { enableHighAccuracy:true, maximumAge:60000, timeout:15000 });
  }
  if (!liveLocationInterval){
    pushLiveLocation();
    liveLocationInterval = setInterval(pushLiveLocation, LIVE_LOCATION_INTERVAL_MS);
  }
}

function stopLiveLocationTracking(){
  if (liveLocationInterval) clearInterval(liveLocationInterval);
  if (liveLocationWatchId != null && navigator.geolocation) navigator.geolocation.clearWatch(liveLocationWatchId);
  liveLocationInterval = null;
  liveLocationWatchId = null;
}

function getTodayInOut(staffAttendance){
  const todayStr = new Date().toDateString();
  const todays = staffAttendance.filter(a=> a.ts && new Date(a.ts).toDateString()===todayStr);
  const inRec = todays.filter(a=>a.type==='in').sort((a,b)=>b.ts-a.ts)[0] || null;
  const outRec = todays.filter(a=>a.type==='out').sort((a,b)=>b.ts-a.ts)[0] || null;
  return { inRec, outRec };
}

function getAutoCheckoutAt(inTs){
  const inDate = new Date(inTs);
  return new Date(inDate.getFullYear(), inDate.getMonth(), inDate.getDate() + 1, 0, 0, 0, 0).getTime();
}

function getOpenShiftForAutoCheckout(inTs){
  let inRec = state.attendance.find(a=> a.type === 'in' && a.ts === inTs) || null;
  if (!inRec){
    const ins = state.attendance.filter(a=>a.type === 'in' && a.ts).sort((a,b)=>(b.ts||0)-(a.ts||0));
    inRec = ins.find(rec=> !state.attendance.some(a=> a.type === 'out' && a.ts >= rec.ts)) || null;
  }
  if (!inRec) return { inRec:null, outRec:null };
  const outRec = state.attendance
    .filter(a=> a.type === 'out' && a.ts >= inRec.ts)
    .sort((a,b)=>(a.ts||0)-(b.ts||0))[0] || null;
  return { inRec, outRec };
}

function setupShiftTimer(inTs){
  clearShiftTimers();
  const remaining = getAutoCheckoutAt(inTs) - Date.now();
  if (remaining <= 0){ doAutoCheckout(inTs); return; }
  autoCheckoutTimeout = setTimeout(()=>doAutoCheckout(inTs), remaining);
  shiftCountdownInterval = setInterval(()=>{ if (state.screen==='staffHome') render(); }, 60000);
}

async function doAutoCheckout(inTs){
  clearShiftTimers();
  state.activeShiftInTs = null;
  if (!state.session || state.session.role !== 'staff') return;
  const { inRec, outRec } = getOpenShiftForAutoCheckout(inTs);
  if (!inRec || (outRec && outRec.ts >= inRec.ts)) return;
  await markAttendance(state.session.businessId, state.session.staffId, state.session.name, 'out', null, null, { auto:true });
  toast('Auto checked-out at 12:00 AM');
  if (state.screen==='staffHome') render();
}

function shiftTimerNote(){
  const { inRec, outRec } = getTodayInOut(state.attendance);
  const onShift = inRec && (!outRec || outRec.ts < inRec.ts);
  if (onShift){
    if (state.activeShiftInTs !== inRec.ts){
      state.activeShiftInTs = inRec.ts;
      setupShiftTimer(inRec.ts);
    }
    const remainingMs = Math.max(0, getAutoCheckoutAt(inRec.ts) - Date.now());
    const h = Math.floor(remainingMs/3600000);
    const m = Math.floor((remainingMs%3600000)/60000);
    return `Auto checkout at 12:00 AM (${h}h ${m}m left)`;
  } else {
    if (state.activeShiftInTs){ clearShiftTimers(); state.activeShiftInTs = null; }
    return '';
  }
}

function timeAgo(ts){
  if (!ts) return '';
  const diffMs = Date.now() - ts;
  const mins = Math.floor(diffMs/60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const hrs = Math.floor(mins/60);
  return hrs + 'h ' + (mins%60) + 'm ago';
}

          <h3 style="margin:0; font-size:15px;">All Staff Locations</h3>
        </div>
        ${staffWithLocation.length===0 ? `<div class="list-empty-note">No staff location saved yet.</div>` :
          staffWithLocation.map(({staff:s, location:l})=>{
            const isActive = Date.now() - (l.updatedAt || 0) <= 10 * 60 * 1000;
            return `
              <div class="attendance-item">
                <div class="row-flex">
                  ${avatarHTML(s.name || l.staffName, s.profilePhoto)}
                  <div>
                    <div class="staff-name" style="font-size:14px;">${escapeHTML(s.name || l.staffName)}</div>
                    <div class="staff-sub">${isActive ? 'Active now' : 'Last seen'} · ${timeAgo(l.updatedAt)}</div>
                  </div>
                </div>
                <div class="att-right" style="gap:6px;">
                  <span class="badge ${isActive ? 'badge-in' : 'badge-pending'}">${isActive ? 'Active' : 'Saved'}</span>
                  <a class="link" href="https://www.google.com/maps?q=${l.lat},${l.lng}" target="_blank" rel="noopener">View on Map ›</a>
                </div>
              </div>
            `;
          }).join('')}
      </div>
      ${staffWithoutLocation.length ? `
        <div class="card">
          <h3 style="margin:0 0 10px; font-size:15px;">No Location Yet</h3>
          <div class="staff-sub" style="margin-bottom:10px;">Ask staff to open Profile and tap Enable Live Location once.</div>
          ${staffWithoutLocation.map(s=>`
            <div class="attendance-item">
              <div class="row-flex">
                ${avatarHTML(s.name, s.profilePhoto)}
                <div class="staff-name" style="font-size:14px;">${escapeHTML(s.name || 'Staff')}</div>
              </div>
              <span class="badge badge-pending">Pending</span>
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>
    ${bottomNav('adminHome')}
  `;

  setTimeout(()=>{
    const el = document.getElementById('liveMapContainer');
    if (!el || !window.L) return;
    if (liveMapInstance){ liveMapInstance.remove(); liveMapInstance = null; }
    liveMapInstance = L.map('liveMapContainer', { zoomControl:true, attributionControl:false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(liveMapInstance);

    if (staffWithLocation.length === 0){
      liveMapInstance.setView([10.05, 76.35], 12); // fallback: Kerala-ish default view
    } else {
      const bounds = [];
      staffWithLocation.forEach(({staff:s, location:l})=>{
        const marker = L.marker([l.lat, l.lng]).addTo(liveMapInstance);
        marker.bindPopup(`<b>${escapeHTML(s.name || l.staffName)}</b><br>Last updated ${timeAgo(l.updatedAt)}`);
        bounds.push([l.lat, l.lng]);
      });
      if (bounds.length === 1) liveMapInstance.setView(bounds[0], 15);
      else liveMapInstance.fitBounds(bounds, { padding:[30,30] });
    }
  }, 0);
}

function escapeHTML(str){
  return String(str || '').replace(/[&<>"']/g, ch=>({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
}

function importantNoticeHTML(){
  const isAdmin = state.session && state.session.role === 'admin';
  const text = state.notice && state.notice.text ? state.notice.text : '';
  if (!isAdmin && !text) return '';
  return `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:${text || isAdmin ? '10px' : '0'};">
        <div class="section-title" style="margin:0;">${iconHTML('pin')} Important Note</div>
        ${isAdmin ? `<button class="link" onclick="editImportantNotice()">Edit</button>` : ''}
      </div>
      ${text ? `<div class="staff-sub" style="white-space:pre-wrap; font-size:14px; line-height:1.45; color:var(--ink);">${escapeHTML(text)}</div>` : `<div class="list-empty-note" style="padding:4px 0 0;">No important note set.</div>`}
    </div>`;
}

async function editImportantNotice(){
  const current = state.notice && state.notice.text ? state.notice.text : '';
  const next = window.prompt('Important note for everyone', current);
  if (next === null) return;
  const trimmed = next.trim();
  if (trimmed) await saveNotice(state.session.businessId, trimmed);
  else await clearNotice(state.session.businessId);
  toast(trimmed ? 'Important note saved' : 'Important note cleared');
}

/* ---------------- Chat ---------------- */
function openAdminChat(staffId, staffName){
  state.chatWithStaffId = staffId;
  state.chatWithStaffName = staffName;
  state.chatMessages = [];
  listenChatMessages(state.session.businessId, staffId);
  go('chatThread');
}
function openStaffChat(){
  state.chatWithStaffId = state.session.staffId;
  state.chatWithStaffName = 'Admin (' + state.session.businessName + ')';
  state.chatMessages = [];
  listenChatMessages(state.session.businessId, state.session.staffId);
  go('chatThread');
}

function renderAdminChatList(app){

    ${topbar('Team','Chat','Message any staff member directly')}
    <div class="screen">
      <div class="card">
        ${state.staffList.length===0 ? `<div class="empty">No staff added yet.</div>` :

                  ${avatarHTML(s.name, s.profilePhoto)}
                  <div>
                    <div class="staff-name">${s.name}</div>

function renderChatThread(app){
  const isAdmin = state.session.role === 'admin';
  app.innerHTML = `
    ${topbar('Chat', state.chatWithStaffName || '', '')}
    <div class="screen" style="flex:1; min-height:0; display:flex; flex-direction:column;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <button class="btn-ghost" style="width:auto; padding:6px 0;" onclick="closeChatThread()">${iconHTML('arrowLeft')}Back</button>
        ${state.chatMessages.length ? `<button class="link" style="color:var(--danger);" onclick="doClearChat()">${iconHTML('trash')} Clear Chat</button>` : ''}
      </div>
      <div class="chat-thread-wrap" style="flex:1; min-height:0;">
        <div class="chat-messages" id="chatMessagesEl">
          ${state.chatMessages.length===0 ? `<div class="list-empty-note">No messages yet — say hi 👋</div>` :
            state.chatMessages.map(m=>{
              const own = (isAdmin && m.sender==='admin') || (!isAdmin && m.sender==='staff');
              return `
                <div class="chat-bubble-row ${own?'own':''}">
                  <div class="chat-bubble ${own?'own':'other'}">
                    ${m.imageData ? `<img class="chat-image" src="${m.imageData}" alt="Sent image">` : ''}
                    ${m.text ? `<div>${escapeHTML(m.text)}</div>` : ''}
                    <span class="chat-time">${fmtTime(m.ts)}</span>
                    <button class="chat-del" onclick="doDeleteChatMessage('${m.id}')" title="Delete">${iconHTML('x')}</button>
                  </div>
                </div>
              `;
            }).join('')}
        </div>
        <div class="emoji-panel ${state.emojiPanelOpen ? 'open' : ''}" id="emojiPanel">
          ${['😀','😂','😍','👍','🙏','👏','✅','❤️','🔥','🎉','📌','⏰','💼','📷','🤝','🙌'].map(e=>`<button type="button" onclick="insertEmoji('${e}')">${e}</button>`).join('')}
        </div>
        <input id="chatImageInput" type="file" accept="image/*" style="display:none" onchange="handleChatImageSelected(event)">
        <div class="chat-input-bar">
          <button class="chat-tool-btn" type="button" onclick="toggleEmojiPanel()" aria-label="Open emoji picker">${iconHTML('smile')}</button>
          <button class="chat-tool-btn" type="button" onclick="document.getElementById('chatImageInput').click()" aria-label="Attach image">${iconHTML('camera')}</button>
          <textarea id="chatInput" rows="1" placeholder="Type a message..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); doSendChatMessage();}"></textarea>
          <button class="chat-send-btn" onclick="doSendChatMessage()" aria-label="Send message">${iconHTML('send')}</button>
        </div>
      </div>
    </div>
  `;
  scrollChatToBottom();

function closeChatThread(){
  if (state.chatListenerRef) state.chatListenerRef.off();
  state.chatListenerRef = null;
  state.chatWithStaffId = null;
  go(state.session.role==='admin' ? 'adminChatList' : 'staffHome');
}

async function doSendChatMessage(imageData){
  const input = document.getElementById('chatInput');
  const text = input ? input.value.trim() : '';
  if (!text && !imageData) return;
  if (input) input.value = '';
  state.emojiPanelOpen = false;
  const isAdmin = state.session.role === 'admin';
  await sendChatMessage(
    state.session.businessId,
    state.chatWithStaffId,
    isAdmin ? 'admin' : 'staff',
    isAdmin ? state.session.name + ' (Admin)' : state.session.name,
    text,
    imageData || ''
  );
}

function toggleEmojiPanel(){
  state.emojiPanelOpen = !state.emojiPanelOpen;
  render();
}

function insertEmoji(emoji){
  const input = document.getElementById('chatInput');
  if (!input) return;
  input.value += emoji;
  input.focus();
}

function handleChatImageSelected(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (!file) return;
  if (!file.type.startsWith('image/')){ toast('Choose an image file.'); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    compressImage(reader.result, 900, 0.72).then(dataUrl=>doSendChatMessage(dataUrl)).catch(()=>toast('Could not send image.'));
  };
  reader.readAsDataURL(file);
}

function compressImage(src, maxSize, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = src;
  });
}

async function doDeleteChatMessage(messageId){
  await deleteChatMessage(state.session.businessId, state.chatWithStaffId, messageId);
}

async function doClearChat(){
  const confirmed = window.confirm('Delete all messages in this chat? This frees up storage and cannot be undone.');
  if (!confirmed) return;
  await clearChatMessages(state.session.businessId, state.chatWithStaffId);
  toast('Chat cleared');
}

function renderScanning(app){
  app.innerHTML = `
    ${topbar('Attendance','Scan Business QR','Point your camera at the QR shown on the admin dashboard')}
    <div class="screen">
      <div class="card">
        <div id="reader"></div>
        <div class="staff-sub" id="scanStatus" style="margin-top:12px; text-align:center;">Requesting camera access...</div>
      </div>
      <button class="btn btn-ghost" onclick="stopScanAndGo('staffHome')">Cancel</button>
    </div>
  `;
  setTimeout(startScanner, 50);
}

function startScanner(){
  const statusEl = document.getElementById('scanStatus');
  html5QrCode = new Html5Qrcode("reader");
  Html5Qrcode.getCameras().then(cameras=>{
    if (!cameras || !cameras.length){
      statusEl.textContent = 'No camera found on this device.';
      return;
    }
    const camId = cameras[cameras.length-1].id;
    html5QrCode.start(
      camId,
      { fps:10, qrbox:220 },
      onScanSuccess,
      ()=>{}
    ).then(()=>{ statusEl.textContent = 'Point camera at the business QR code'; })
     .catch(err=>{ statusEl.textContent = 'Camera error: ' + err; });
  }).catch(err=>{
    statusEl.textContent = 'Camera permission denied or unavailable.';
  });
}

function stopScanAndGo(screen){
  if (html5QrCode){
    html5QrCode.stop().then(()=>{ html5QrCode.clear(); go(screen); }).catch(()=> go(screen));
  } else go(screen);
}

function extractBusinessId(decodedText){
  // Supports both the new URL-based QR (?attend=businessId) and legacy JSON QR
  try{
    const url = new URL(decodedText);
    const attend = url.searchParams.get('attend');
    if (attend) return attend;
  }catch(e){ /* not a URL, fall through */ }
  try{
    const payload = JSON.parse(decodedText);
    if (payload.businessId) return payload.businessId;
  }catch(e){}
  return null;
}

let scanLock = false;
async function onScanSuccess(decodedText){
  if (scanLock) return;
  scanLock = true;
  const statusEl = document.getElementById('scanStatus');
  const businessId = extractBusinessId(decodedText);
  if (!businessId){
    statusEl.textContent = 'Invalid QR code, try again.';
    scanLock = false;
    return;
  }
  if (businessId !== state.session.businessId){
    statusEl.textContent = "This QR doesn't belong to your business.";
    scanLock = false;
    return;
  }
  statusEl.textContent = 'Getting your location...';
  stopScanAndGo('punching');
  prepareConfirm(state.session.businessId, state.session.staffId, state.session.name, state.session.adminMobile);
}

function renderConfirmPunch(app){
  const p = state.pendingPunch;
  if (!p){ go('staffHome'); return; }
  const inDisabled = p.lockedType === 'out';
  const outDisabled = p.lockedType === 'in';
  app.innerHTML = `
    ${topbar('Attendance','Confirm Your Punch','Location captured — pick what this scan means')}
    <div class="screen">
      <div class="card" style="text-align:center;">
        <div class="staff-sub" style="margin-bottom:14px;">${iconHTML('pin')} Location captured</div>
        <div class="chip-row" style="justify-content:center;">
          <button class="chip ${p.type==='in'?'active':''}" style="padding:14px 22px; font-size:14px; ${inDisabled?'opacity:.35; cursor:not-allowed;':''}" onclick="setPendingType('in')">✓ Check In</button>
          <button class="chip ${p.type==='out'?'active':''}" style="padding:14px 22px; font-size:14px; ${outDisabled?'opacity:.35; cursor:not-allowed;':''}" onclick="setPendingType('out')">↩ Check Out</button>
        </div>
        ${p.lockedType ? `<div class="staff-sub" style="margin-top:12px;">You've already ${p.lockedType==='out'?'checked in':'checked out'} today, so only ${p.lockedType==='out'?'Check Out':'Check In'} is available.</div>` : ''}
      </div>
      <button class="btn btn-marigold" onclick="confirmPunch()">Confirm ${p.type==='in'?'Check In':'Check Out'}</button>
      <button class="btn btn-ghost" onclick="state.pendingPunch=null; go('staffHome')">Cancel</button>
    </div>
  `;
}

function renderPunching(app){
  app.innerHTML = `<div class="spinner-box">Getting your location…</div>`;
}

function renderPunchResult(app){
  const type = state.lastPunchType || 'in';
  const now = new Date();
  const adminMobile = state.lastPunchAdminMobile;
  const waMsg = `${type==='in' ? 'Checked IN' : 'Checked OUT'} - ${state.session.name} at ${now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})} on ${now.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})} (${state.session.businessName})`;
  const waLink = adminMobile ? `https://wa.me/91${adminMobile}?text=${encodeURIComponent(waMsg)}` : null;
  app.innerHTML = `
    <div class="screen">
      <div class="card scan-punch ${type==='out'?'out':''}">
        <div class="stamp">${type==='in' ? '✓' : '↩'}</div>
        <h2 style="margin:0;">${type==='in' ? 'Checked In' : 'Checked Out'}</h2>
        <div class="time mono">${now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</div>
        <div class="date">${now.toLocaleDateString('en-IN',{weekday:'long', day:'numeric', month:'long'})}</div>
      </div>
      ${waLink ? `<a class="btn btn-outline" style="text-decoration:none;" href="${waLink}" target="_blank" rel="noopener">${iconHTML('smartphone')}Notify Admin on WhatsApp</a>` : ''}
      <button class="btn btn-primary" onclick="go('staffHome')">Done</button>
    </div>
  `;
  scanLock = false;
}

bootstrap();
