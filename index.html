<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Beaconblitz Staff — Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --ink:#161233;
    --indigo:#1B1550;
    --indigo-2:#2E2A78;
    --marigold:#FF8A3D;
    --marigold-dim:#FFE3CC;
    --cream:#FBF8F3;
    --paper:#FFFFFF;
    --muted:#6B6885;
    --line:#E7E3F5;
    --success:#2E9E6D;
    --danger:#D64545;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Sora',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}

  #app{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    background:var(--cream);
    position:relative;
    display:flex;
    flex-direction:column;
  }

  .topbar{
    background:linear-gradient(135deg, #1B1550 0%, #3D2E8C 45%, #C2417A 85%, #FF8A3D 120%);
    color:#fff;
    padding:22px 20px 26px;
    border-radius:0 0 26px 26px;
  }
  .topbar .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#C9C4F0;
    font-weight:600;
    margin-bottom:6px;
  }
  .topbar h1{
    font-size:24px;
    margin:0;
    font-weight:700;
  }
  .topbar p{margin:6px 0 0; color:#C9C4F0; font-size:14px;}

  .screen{padding:20px; flex:1; display:flex; flex-direction:column; gap:16px;}

  .card{
    background:var(--paper);
    border-radius:var(--radius);
    padding:20px;
    border:1px solid var(--line);
  }

  label{display:block; font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px;}
  input, select{
    width:100%;
    padding:14px 14px;
    border-radius:12px;
    border:1.5px solid var(--line);
    font-size:16px;
    font-family:'Inter',sans-serif;
    background:#fff;
    color:var(--ink);
    margin-bottom:14px;
  }
  input:focus, select:focus{outline:none; border-color:var(--indigo-2);}

  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%;
    padding:15px 18px;
    border-radius:14px;
    border:none;
    font-family:'Sora',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:linear-gradient(120deg,#1B1550,#3D2E8C); color:#fff;}
  .btn-marigold{background:linear-gradient(120deg,#FF8A3D,#C2417A); color:#fff;}
  .btn-outline{background:transparent; color:var(--indigo); border:1.5px solid var(--indigo);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--muted); font-weight:500; padding:8px;}

  .role-toggle{display:flex; gap:8px; margin-bottom:14px;}
  .role-toggle button{
    flex:1; padding:12px; border-radius:12px; border:1.5px solid var(--line);
    background:#fff; font-family:'Sora',sans-serif; font-weight:600; font-size:14px; color:var(--muted); cursor:pointer;
  }
  .role-toggle button.active{background:linear-gradient(120deg,#1B1550,#3D2E8C); border-color:var(--indigo); color:#fff;}

  .chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .chip{
    padding:8px 14px; border-radius:20px; border:1.5px solid var(--line); background:#fff;
    font-size:12px; font-weight:600; color:var(--muted); cursor:pointer; font-family:'Inter',sans-serif;
  }
  .chip.active{background:var(--indigo); border-color:var(--indigo); color:#fff;}

  .link{color:var(--indigo-2); font-weight:600; text-decoration:underline; cursor:pointer; background:none; border:none; padding:0; font-size:14px; font-family:'Inter',sans-serif;}

  .error-text{color:var(--danger); font-size:13px; margin:-8px 0 10px;}

  .stat-row{display:flex; gap:12px;}
  .stat{flex:1; background:var(--marigold-dim); border-radius:14px; padding:14px; text-align:center;}
  .stat .num{font-family:'Sora',sans-serif; font-weight:800; font-size:22px; color:var(--indigo);}
  .stat .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}

  .qr-ticket{
    background:#fff;
    border-radius:20px;
    padding:22px;
    text-align:center;
    position:relative;
    border:1.5px dashed var(--indigo-2);
  }
  .qr-ticket .biz{font-family:'Sora',sans-serif; font-weight:700; color:var(--indigo); font-size:16px; margin-bottom:12px;}
  .qr-ticket .qrbox{display:flex; justify-content:center; margin:6px 0 14px;}
  .qr-ticket .hint{font-size:12px; color:var(--muted);}

  .staff-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 0; border-bottom:1px solid var(--line);
  }
  .staff-row:last-child{border-bottom:none;}
  .staff-name{font-weight:600; font-size:15px;}
  .staff-sub{font-size:12px; color:var(--muted);}
  .avatar{
    width:38px;height:38px;border-radius:10px;background:var(--indigo-2);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;
    margin-right:12px;
  }
  .row-flex{display:flex; align-items:center;}

  .date-group-label{
    font-family:'Sora',sans-serif; font-weight:700; font-size:13px; color:var(--indigo);
    margin:2px 0 2px; padding-top:6px;
  }
  .attendance-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .attendance-item:last-child{border-bottom:none;}
  .att-left{display:flex; flex-direction:column; gap:2px;}
  .att-right{display:flex; flex-direction:column; align-items:flex-end; gap:4px;}
  .badge{
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:.04em;
  }
  .badge-in{background:#DDF3E7; color:var(--success);}
  .badge-out{background:#FDE7E7; color:var(--danger);}
  .badge-half{background:var(--marigold-dim); color:#B85E1A;}
  .badge-pending{background:#EDEBFA; color:var(--muted);}
  .map-link{font-size:11px; color:var(--indigo-2); text-decoration:none; font-weight:600;}

  .bottom-nav{
    display:flex;
    border-top:1px solid var(--line);
    background:#fff;
    padding:10px 6px 14px;
  }
  .bottom-nav button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    font-family:'Inter',sans-serif; font-size:11px; font-weight:600; color:var(--muted); cursor:pointer;
  }
  .bottom-nav button.active{color:var(--marigold);}
  .bottom-nav .icon{font-size:20px;}

  .scan-punch{
    text-align:center;
    padding:30px 20px;
  }
  .scan-punch .stamp{
    width:84px;height:84px;border-radius:50%;
    background:var(--success);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px; color:#fff; font-size:38px;
  }
  .scan-punch.out .stamp{background:var(--danger);}
  .scan-punch .time{font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:600; color:var(--indigo);}
  .scan-punch .date{color:var(--muted); font-size:13px; margin-top:4px;}

  #reader{border-radius:16px; overflow:hidden;}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:12px 20px; border-radius:12px; font-size:13px;
    max-width:400px; text-align:center; z-index:999;
  }
  .empty{
    text-align:center; padding:30px 10px; color:var(--muted); font-size:14px;
  }
  .config-warning{
    background:#FFF4E8; border:1.5px solid var(--marigold); border-radius:14px; padding:16px; font-size:13px; color:#7A4B12; line-height:1.5;
  }
  .config-warning code{background:#fff; padding:2px 6px; border-radius:6px;}
  .spinner-box{text-align:center; padding:40px 20px; color:var(--muted);}
</style>
</head>
<body>
<div id="app"></div>
<div id="toastHost"></div>

<script>
/* =========================================================
   FIREBASE CONFIG — bb-staff project (Realtime Database)
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDsf4bzIHvtI-D9FkBY5ImYf9E7cmZc9R8",
  authDomain: "bb-staff.firebaseapp.com",
  databaseURL: "https://bb-staff-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "bb-staff",
  storageBucket: "bb-staff.firebasestorage.app",
  messagingSenderId: "799545974014",
  appId: "1:799545974014:web:dbb2dbfd44e53cedbbd9af"
};

let db = null;
let firebaseReady = false;
try {
  if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    firebaseReady = true;
  }
} catch (e) { console.error(e); }

const SESSION_KEY = 'bbStaffSession';

/* ---------------------------------------------------------
   APP STATE
   --------------------------------------------------------- */
const state = {
  screen: 'loading',
  role: 'admin',      // 'admin' | 'staff'  (for landing/login toggle only)
  session: null,      // { businessId, role, staffId?, name, businessName }
  staffList: [],
  attendance: [],
  staffListenerRef: null,
  attendanceListenerRef: null,
  error: '',
  lastPunchType: 'in',
  pendingAttendBiz: null,
  report: { staffId: 'all', range: 'today' }
};

function toast(msg){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=> el.remove(), 2600);
}

function go(screen){ state.screen = screen; state.error=''; render(); }

function saveSession(session){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(session)); }catch(e){}
}
function loadSession(){
  try{ const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}

/* ---------------------------------------------------------
   REALTIME DATABASE HELPERS
   /mobileIndex/{mobile} = { role, businessId, staffId? }
   /businesses/{businessId} = { name, sector, mobile, pin, adminName }
   /businesses/{businessId}/staff/{staffId} = { name, mobile, pin, gender, designation }
   /businesses/{businessId}/attendance/{pushId} = { staffId, staffName, type, ts, lat, lng }
   --------------------------------------------------------- */

async function registerBusiness(data){
  const mobileSnap = await db.ref('mobileIndex/' + data.mobile).once('value');
  if (mobileSnap.exists()) throw new Error('This mobile number is already registered. Try logging in instead.');

  const bizRef = db.ref('businesses').push();
  await bizRef.set({
    name: data.businessName,
    sector: data.sector || '',
    mobile: data.mobile,
    pin: data.pin,
    adminName: data.adminName,
    createdAt: firebase.database.ServerValue.TIMESTAMP
  });
  await db.ref('mobileIndex/' + data.mobile).set({ role: 'admin', businessId: bizRef.key });
  return bizRef.key;
}

async function loginUser(mobile, pin){
  const idxSnap = await db.ref('mobileIndex/' + mobile).once('value');
  if (!idxSnap.exists()) throw new Error("We couldn't find an account with that mobile number.");
  const idx = idxSnap.val();

  if (idx.role === 'admin'){
    const bizSnap = await db.ref('businesses/' + idx.businessId).once('value');
    const biz = bizSnap.val();
    if (biz.pin !== pin) throw new Error('Incorrect PIN.');
    return { role:'admin', businessId: idx.businessId, name: biz.adminName, businessName: biz.name };
  } else {
    const staffSnap = await db.ref('businesses/' + idx.businessId + '/staff/' + idx.staffId).once('value');
    const staff = staffSnap.val();
    if (staff.pin !== pin) throw new Error('Incorrect PIN.');
    const bizSnap = await db.ref('businesses/' + idx.businessId).once('value');
    const biz = bizSnap.val();
    return { role:'staff', businessId: idx.businessId, staffId: idx.staffId, name: staff.name, businessName: biz.name, adminMobile: biz.mobile };
  }
}

async function addStaff(businessId, data){
  const mobileSnap = await db.ref('mobileIndex/' + data.mobile).once('value');
  if (mobileSnap.exists()) throw new Error('This mobile number is already registered elsewhere.');

  const staffRef = db.ref('businesses/' + businessId + '/staff').push();
  await staffRef.set({
    name: data.name,
    mobile: data.mobile,
    pin: data.pin,
    gender: data.gender || '',
    designation: data.designation || '',
    expectedCheckIn: data.expectedCheckIn || '09:30',
    expectedCheckOut: data.expectedCheckOut || '18:00',
    graceMinutes: data.graceMinutes != null && data.graceMinutes !== '' ? Number(data.graceMinutes) : 30,
    monthlySalary: data.monthlySalary != null && data.monthlySalary !== '' ? Number(data.monthlySalary) : 0,
    createdAt: firebase.database.ServerValue.TIMESTAMP
  });
  await db.ref('mobileIndex/' + data.mobile).set({ role:'staff', businessId, staffId: staffRef.key });
  return staffRef.key;
}

async function updateStaff(businessId, staffId, data){
  await db.ref('businesses/' + businessId + '/staff/' + staffId).update({
    name: data.name,
    designation: data.designation || '',
    expectedCheckIn: data.expectedCheckIn || '09:30',
    expectedCheckOut: data.expectedCheckOut || '18:00',
    graceMinutes: data.graceMinutes != null && data.graceMinutes !== '' ? Number(data.graceMinutes) : 30,
    monthlySalary: data.monthlySalary != null && data.monthlySalary !== '' ? Number(data.monthlySalary) : 0
  });
}

function listenStaff(businessId){
  if (state.staffListenerRef) state.staffListenerRef.off();
  const ref = db.ref('businesses/' + businessId + '/staff');
  state.staffListenerRef = ref;
  ref.on('value', snap=>{
    const val = snap.val() || {};
    state.staffList = Object.keys(val).map(id=>({ id, ...val[id] }));
    if (['adminStaff','adminHome','adminAttendance'].includes(state.screen)) render();
  });
}

function listenAttendance(businessId, staffId){
  if (state.attendanceListenerRef) state.attendanceListenerRef.off();
  const ref = db.ref('businesses/' + businessId + '/attendance').limitToLast(1000);
  state.attendanceListenerRef = ref;
  ref.on('value', snap=>{
    const val = snap.val() || {};
    let list = Object.keys(val).map(id=>({ id, ...val[id] }));
    if (staffId) list = list.filter(a=>a.staffId === staffId);
    list.sort((a,b)=> (b.ts||0) - (a.ts||0));
    state.attendance = list;
    if (['adminAttendance','staffHome'].includes(state.screen)) render();
  });
}

async function getTodayPunchStatus(businessId, staffId){
  const attSnap = await db.ref('businesses/' + businessId + '/attendance').once('value');
  const val = attSnap.val() || {};
  const todayStr = new Date().toDateString();
  const todaysMine = Object.values(val).filter(a=>
    a.staffId===staffId && a.ts && new Date(a.ts).toDateString()===todayStr
  );
  const hasIn = todaysMine.some(a=>a.type==='in');
  const hasOut = todaysMine.some(a=>a.type==='out');
  const lastInTime = todaysMine.filter(a=>a.type==='in').sort((a,b)=>b.ts-a.ts)[0];
  const lastOutTime = todaysMine.filter(a=>a.type==='out').sort((a,b)=>b.ts-a.ts)[0];
  return { hasIn, hasOut, lastInTime, lastOutTime };
}

async function markAttendance(businessId, staffId, staffName, type, lat, lng){
  await db.ref('businesses/' + businessId + '/attendance').push({
    staffId, staffName, type, lat, lng,
    ts: firebase.database.ServerValue.TIMESTAMP
  });
  return type;
}

/* ---------------------------------------------------------
   BOOTSTRAP — restore session + handle QR deep-link (?attend=businessId)
   --------------------------------------------------------- */
async function bootstrap(){
  if (!firebaseReady){ go('setup'); return; }

  const urlParams = new URLSearchParams(window.location.search);
  const attendBiz = urlParams.get('attend');
  const existing = loadSession();

  if (existing){
    state.session = existing;
    if (existing.role === 'admin'){
      listenStaff(existing.businessId);
      listenAttendance(existing.businessId, null);
    } else {
      listenAttendance(existing.businessId, existing.staffId);
    }
  }

  if (attendBiz){
    // Clean the URL so a refresh doesn't re-trigger the punch
    const cleanUrl = window.location.origin + window.location.pathname;
    window.history.replaceState({}, document.title, cleanUrl);

    if (existing && existing.role === 'staff' && existing.businessId === attendBiz){
      go('punching');
      prepareConfirm(existing.businessId, existing.staffId, existing.name, existing.adminMobile);
      return;
    } else if (existing && existing.role === 'admin'){
      toast("Log in as staff on this device to mark attendance.");
    } else if (existing && existing.businessId !== attendBiz){
      toast("This QR is for a different business than your account.");
    } else if (!existing){
      state.pendingAttendBiz = attendBiz;
      state.role = 'staff';
      go('login');
      return;
    }
  }

  if (existing){
    go(existing.role === 'admin' ? 'adminHome' : 'staffHome');
  } else {
    go('landing');
  }
}

async function prepareConfirm(businessId, staffId, staffName, adminMobile){
  try{
    const status = await getTodayPunchStatus(businessId, staffId);
    if (status.hasIn && status.hasOut){
      state.error = `You've already completed today's attendance — Checked In at ${fmtTime(status.lastInTime.ts)} and Checked Out at ${fmtTime(status.lastOutTime.ts)}.`;
      go('staffHome');
      return;
    }
    const suggested = status.hasIn ? 'out' : 'in';
    navigator.geolocation.getCurrentPosition((pos)=>{
      const { latitude, longitude } = pos.coords;
      state.pendingPunch = {
        businessId, staffId, staffName, adminMobile,
        type: suggested, lat: latitude, lng: longitude,
        lockedType: status.hasIn ? 'out' : (status.hasOut ? 'in' : null)
      };
      go('confirmPunch');
    }, (err)=>{
      state.error = 'Location permission is required to mark attendance.';
      go('staffHome');
    }, { enableHighAccuracy:true, timeout:12000 });
  }catch(e){
    state.error = 'Could not read attendance status. Try again.';
    go('staffHome');
  }
}

function setPendingType(type){
  if (state.pendingPunch.lockedType && state.pendingPunch.lockedType !== type){
    toast(type==='in' ? "You've already checked in today." : "You've already checked out today.");
    return;
  }
  state.pendingPunch.type = type;
  render();
}

async function confirmPunch(){
  const p = state.pendingPunch;
  if (!p) { go('staffHome'); return; }
  await markAttendance(p.businessId, p.staffId, p.staffName, p.type, p.lat, p.lng);
  state.lastPunchType = p.type;
  state.lastPunchAdminMobile = p.adminMobile;
  state.pendingPunch = null;
  go('punchResult');
}

/* ---------------------------------------------------------
   RENDER
   --------------------------------------------------------- */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const map = {
    loading: renderLoading,
    setup: renderSetup,
    landing: renderLanding,
    login: renderLogin,
    registerBiz: renderRegisterBiz,
    adminHome: renderAdminHome,
    adminStaff: renderAdminStaff,
    addStaff: renderAddStaff,
    editStaff: renderEditStaff,
    adminAttendance: renderAdminAttendance,
    adminSalary: renderAdminSalary,
    staffSalary: renderStaffSalary,
    staffHome: renderStaffHome,
    scanning: renderScanning,
    punching: renderPunching,
    confirmPunch: renderConfirmPunch,
    punchResult: renderPunchResult
  };
  (map[state.screen] || renderLanding)(app);
}

function topbar(eyebrow, title, sub){
  return `<div class="topbar">
    <div class="eyebrow">${eyebrow}</div>
    <h1>${title}</h1>
    ${sub ? `<p>${sub}</p>` : ''}
  </div>`;
}

function renderLoading(app){
  app.innerHTML = `<div class="spinner-box">Loading Beaconblitz Staff…</div>`;
}

function renderSetup(app){
  app.innerHTML = `
    ${topbar('Beaconblitz Staff','Connect Firebase','One-time setup before the app can run')}
    <div class="screen">
      <div class="config-warning">
        This app needs a Firebase project with <strong>Realtime Database</strong> enabled.
        Open this file and replace the <code>firebaseConfig</code> object near the top
        of the &lt;script&gt; with your project's config. Then reload.
      </div>
    </div>`;
}

function renderLanding(app){
  app.innerHTML = `
    ${topbar('Welcome to','Beaconblitz Staff','QR attendance for your whole team')}
    <div class="screen">
      <div class="card">
        <div class="role-toggle">
          <button class="${state.role==='admin'?'active':''}" onclick="setRole('admin')">I'm an Admin</button>
          <button class="${state.role==='staff'?'active':''}" onclick="setRole('staff')">I'm Staff</button>
        </div>
        <p class="staff-sub" style="margin-bottom:18px;">
          ${state.role==='admin' ? 'Register your business and start adding staff.' : 'Log in with the mobile number and PIN your admin gave you.'}
        </p>
        <button class="btn btn-primary" onclick="go('login')">Log in</button>
        ${state.role==='admin' ? `<div style="height:10px"></div><button class="btn btn-outline" onclick="go('registerBiz')">Register a new business</button>` : ''}
      </div>
    </div>`;
}
function setRole(r){ state.role = r; render(); }

function renderLogin(app){
  app.innerHTML = `
    ${topbar('Log in', state.role==='admin' ? 'Admin Login' : 'Staff Login', state.pendingAttendBiz ? 'Log in to confirm your attendance scan' : 'Enter your mobile number and PIN')}
    <div class="screen">
      <div class="card">
        <label>Mobile number</label>
        <input id="loginMobile" type="tel" maxlength="10" placeholder="9876543210">
        <label>PIN</label>
        <input id="loginPin" type="password" maxlength="6" placeholder="4-digit PIN">

function parseTimeToMinutes(timeStr){
  if (!timeStr) return null;
  const parts = timeStr.split(':').map(Number);
  if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) return null;
  return parts[0]*60 + parts[1];
}

function getDayStatus(staff, dateObj, staffAttendance){
  const dayStr = dateObj.toDateString();
  const todayStr = new Date().toDateString();
  if (dateObj > new Date() && dayStr !== todayStr) return { status:'future' };

  const dayRecords = staffAttendance.filter(a=> a.ts && new Date(a.ts).toDateString()===dayStr);
  const inRec = dayRecords.filter(a=>a.type==='in').sort((a,b)=>a.ts-b.ts)[0];
  const outRec = dayRecords.filter(a=>a.type==='out').sort((a,b)=>a.ts-b.ts)[0];
  const expectedInMin = parseTimeToMinutes(staff.expectedCheckIn);
  const grace = (staff.graceMinutes!=null && staff.graceMinutes!=='') ? Number(staff.graceMinutes) : 30;

  if (!inRec){
    if (dayStr === todayStr){
      const now = new Date();
      const nowMin = now.getHours()*60 + now.getMinutes();
      if (expectedInMin==null || nowMin <= expectedInMin+grace) return { status:'pending' };
    }
    return { status:'absent', inTime:null, outTime:null };
  }
  if (expectedInMin==null) return { status:'present', inTime:inRec.ts, outTime: outRec?outRec.ts:null };
  const inDate = new Date(inRec.ts);
  const inMin = inDate.getHours()*60 + inDate.getMinutes();
  const status = inMin > expectedInMin+grace ? 'half' : 'present';
  return { status, inTime:inRec.ts, outTime: outRec?outRec.ts:null };
}

function dailyRate(staff){ return (Number(staff.monthlySalary)||0) / 30; }
function payForStatus(staff, status){
  if (status==='present') return dailyRate(staff);
  if (status==='half') return dailyRate(staff)/2;
  return 0;
}
function statusLabel(status){
  return { present:'Present', half:'Half Day', absent:'Absent', pending:'Pending', future:'—' }[status] || status;
}
function statusBadgeClass(status){
  return { present:'badge-in', half:'badge-half', absent:'badge-out', pending:'badge-pending', future:'badge-pending' }[status] || '';
}
function fmtTime(ts){
  if (!ts) return '—';
  return new Date(ts).toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
}
function fmtDateLabel(ts){
  const d = new Date(ts);
  const today = new Date();
  const yesterday = new Date(); yesterday.setDate(today.getDate()-1);
  if (d.toDateString()===today.toDateString()) return 'Today';
  if (d.toDateString()===yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric', weekday:'short' });
}

function ensureSalaryState(){
  if (!state.salary) state.salary = { month: new Date().getMonth(), year: new Date().getFullYear(), staffId: null };
}

function shiftSalaryMonth(delta){
  ensureSalaryState();
  let m = state.salary.month + delta;
  let y = state.salary.year;
  if (m < 0){ m = 11; y -= 1; }
  if (m > 11){ m = 0; y += 1; }
  state.salary.month = m; state.salary.year = y;
  render();
}

function setSalaryStaff(id){ ensureSalaryState(); state.salary.staffId = id; render(); }

function buildMonthRows(staff, year, month, staffAttendance){
  const daysCount = new Date(year, month+1, 0).getDate();
  const today = new Date();
  const rows = [];
  for (let d=1; d<=daysCount; d++){
    const dateObj = new Date(year, month, d);
    if (dateObj > today && dateObj.toDateString() !== today.toDateString()) break;
    const { status, inTime, outTime } = getDayStatus(staff, dateObj, staffAttendance);
    rows.push({ dateObj, status, inTime, outTime, pay: payForStatus(staff, status) });
  }
  return rows;
}

function rangeStart(range){
  const now = new Date();
  if (range==='today'){ const d=new Date(now); d.setHours(0,0,0,0); return d.getTime(); }
  if (range==='week'){ const d=new Date(now); d.setDate(d.getDate()-6); d.setHours(0,0,0,0); return d.getTime(); }
  if (range==='month'){ const d=new Date(now); d.setDate(d.getDate()-29); d.setHours(0,0,0,0); return d.getTime(); }
  return 0; // 'all'
}

                  <div class="att-right">
                    <span class="badge ${a.type==='in'?'badge-in':'badge-out'}">${a.type==='in'?'Check In':'Check Out'}</span>
                    ${a.lat && a.lng ? `<a class="map-link" href="https://www.google.com/maps?q=${a.lat},${a.lng}" target="_blank" rel="noopener">View location</a>` : ''}
                  </div>
                </div>
              `).join('');
          }).join('')}
      </div>
    </div>
    ${bottomNav('adminAttendance')}
  `;
}
function setReportStaff(id){ state.report.staffId = id; render(); }
function setReportRange(range){ state.report.range = range; render(); }

function renderStaffHome(app){
  const last = state.attendance[0];
  app.innerHTML = `
    ${topbar('Staff', state.session.name, state.session.businessName)}
    <div class="screen">
      ${state.error ? `<div class="error-text" style="margin:0;">${state.error}</div>` : ''}
      <div class="card" style="text-align:center;">
        <div class="staff-sub" style="margin-bottom:14px;">
          ${last ? `Last punch: <strong>${last.type==='in'?'Checked In':'Checked Out'}</strong> · ${fmtTime(last.ts)}` : 'No attendance yet today'}
        </div>
        <button class="btn btn-marigold" onclick="go('scanning')">📷 Scan QR to Mark Attendance</button>
        <div class="staff-sub" style="margin-top:10px;">Tip: you can also scan the office QR with your phone's normal camera app — it'll open straight here.</div>
      </div>
      <div class="card">
        <h3 style="margin:0 0 10px; font-size:15px;">My Recent Attendance</h3>
        ${state.attendance.length===0 ? `<div class="empty">Nothing here yet.</div>` :
          state.attendance.slice(0,10).map(a=>`
            <div class="attendance-item">
              <div class="staff-sub mono">${fmtDateLabel(a.ts)} · ${fmtTime(a.ts)}</div>
              <span class="badge ${a.type==='in'?'badge-in':'badge-out'}">${a.type==='in'?'In':'Out'}</span>
            </div>
          `).join('')}
      </div>
    </div>
    ${bottomNav('staffHome')}
  `;
}

let html5QrCode = null;
function renderScanning(app){
  app.innerHTML = `
    ${topbar('Attendance','Scan Business QR','Point your camera at the QR shown on the admin dashboard')}
    <div class="screen">
      <div class="card">
        <div id="reader"></div>
        <div class="staff-sub" id="scanStatus" style="margin-top:12px; text-align:center;">Requesting camera access...</div>
      </div>
      <button class="btn btn-ghost" onclick="stopScanAndGo('staffHome')">Cancel</button>
    </div>
  `;
  setTimeout(startScanner, 50);
}

function startScanner(){
  const statusEl = document.getElementById('scanStatus');
  html5QrCode = new Html5Qrcode("reader");
  Html5Qrcode.getCameras().then(cameras=>{
    if (!cameras || !cameras.length){
      statusEl.textContent = 'No camera found on this device.';
      return;
    }
    const camId = cameras[cameras.length-1].id;
    html5QrCode.start(
      camId,
      { fps:10, qrbox:220 },
      onScanSuccess,
      ()=>{}
    ).then(()=>{ statusEl.textContent = 'Point camera at the business QR code'; })
     .catch(err=>{ statusEl.textContent = 'Camera error: ' + err; });
  }).catch(err=>{
    statusEl.textContent = 'Camera permission denied or unavailable.';
  });
}

function stopScanAndGo(screen){
  if (html5QrCode){
    html5QrCode.stop().then(()=>{ html5QrCode.clear(); go(screen); }).catch(()=> go(screen));
  } else go(screen);
}

function extractBusinessId(decodedText){
  // Supports both the new URL-based QR (?attend=businessId) and legacy JSON QR
  try{
    const url = new URL(decodedText);
    const attend = url.searchParams.get('attend');
    if (attend) return attend;
  }catch(e){ /* not a URL, fall through */ }
  try{
    const payload = JSON.parse(decodedText);
    if (payload.businessId) return payload.businessId;
  }catch(e){}
  return null;
}

let scanLock = false;
async function onScanSuccess(decodedText){
  if (scanLock) return;
  scanLock = true;
  const statusEl = document.getElementById('scanStatus');
  const businessId = extractBusinessId(decodedText);
  if (!businessId){
    statusEl.textContent = 'Invalid QR code, try again.';
    scanLock = false;
    return;
  }
  if (businessId !== state.session.businessId){
    statusEl.textContent = "This QR doesn't belong to your business.";
    scanLock = false;
    return;
  }
  statusEl.textContent = 'Getting your location...';
  stopScanAndGo('punching');
  prepareConfirm(state.session.businessId, state.session.staffId, state.session.name, state.session.adminMobile);
}

function renderConfirmPunch(app){
  const p = state.pendingPunch;
  if (!p){ go('staffHome'); return; }
  const inDisabled = p.lockedType === 'out';
  const outDisabled = p.lockedType === 'in';
  app.innerHTML = `
    ${topbar('Attendance','Confirm Your Punch','Location captured — pick what this scan means')}
    <div class="screen">
      <div class="card" style="text-align:center;">
        <div class="staff-sub" style="margin-bottom:14px;">📍 Location captured</div>
        <div class="chip-row" style="justify-content:center;">
          <button class="chip ${p.type==='in'?'active':''}" style="padding:14px 22px; font-size:14px; ${inDisabled?'opacity:.35; cursor:not-allowed;':''}" onclick="setPendingType('in')">✓ Check In</button>
          <button class="chip ${p.type==='out'?'active':''}" style="padding:14px 22px; font-size:14px; ${outDisabled?'opacity:.35; cursor:not-allowed;':''}" onclick="setPendingType('out')">↩ Check Out</button>
        </div>
        ${p.lockedType ? `<div class="staff-sub" style="margin-top:12px;">You've already ${p.lockedType==='out'?'checked in':'checked out'} today, so only ${p.lockedType==='out'?'Check Out':'Check In'} is available.</div>` : ''}
      </div>
      <button class="btn btn-marigold" onclick="confirmPunch()">Confirm ${p.type==='in'?'Check In':'Check Out'}</button>
      <button class="btn btn-ghost" onclick="state.pendingPunch=null; go('staffHome')">Cancel</button>
    </div>
  `;
}

function renderPunching(app){
  app.innerHTML = `<div class="spinner-box">Getting your location…</div>`;
}

function renderPunchResult(app){
  const type = state.lastPunchType || 'in';
  const now = new Date();
  const adminMobile = state.lastPunchAdminMobile;
  const waMsg = `${type==='in' ? '✅ Checked IN' : '↩ Checked OUT'} — ${state.session.name} at ${now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})} on ${now.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})} (${state.session.businessName})`;
  const waLink = adminMobile ? `https://wa.me/91${adminMobile}?text=${encodeURIComponent(waMsg)}` : null;
  app.innerHTML = `
    <div class="screen">
      <div class="card scan-punch ${type==='out'?'out':''}">
        <div class="stamp">${type==='in' ? '✓' : '↩'}</div>
        <h2 style="margin:0;">${type==='in' ? 'Checked In' : 'Checked Out'}</h2>
        <div class="time mono">${now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</div>
        <div class="date">${now.toLocaleDateString('en-IN',{weekday:'long', day:'numeric', month:'long'})}</div>
      </div>
      ${waLink ? `<a class="btn btn-outline" style="text-decoration:none;" href="${waLink}" target="_blank" rel="noopener">📲 Notify Admin on WhatsApp</a>` : ''}
      <button class="btn btn-primary" onclick="go('staffHome')">Done</button>
    </div>
  `;
  scanLock = false;
}

bootstrap();
</script>
</body>
</html>
